<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Monitor IAVTech</title>
<style>
:root{--bg:#eef2f7;--pn:#ffffff;--tx:#122038;--mut:#5b6b85;--ln:#d7deea;--ok:#0f8a5f;--at:#b7791f;--cr:#c2362b;--ac:#1565d8;--trk:#e3e9f2}
@media(prefers-color-scheme:dark){:root{--bg:#0c1526;--pn:#132038;--tx:#e6edf8;--mut:#93a4c3;--ln:#22324f;--ok:#3cc48f;--at:#e2a640;--cr:#ff6b5e;--ac:#5aa0ff;--trk:#1d2c48}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input{font:inherit}button{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input{width:100%;min-height:44px;border:1px solid var(--ln);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--tx)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--pn);border-bottom:1px solid var(--ln)}
.top h1{font-size:18px;margin:0;letter-spacing:-.01em}.top .mut{margin-right:auto}.tabs{display:flex;gap:4px}.tabs button{border-radius:999px}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}.kpi{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px}.kpi b{display:block;font-size:26px;letter-spacing:-.02em}.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--trk)}.tag.ok{background:color-mix(in srgb,var(--ok) 18%,var(--pn));color:var(--ok)}.tag.at{background:color-mix(in srgb,var(--at) 18%,var(--pn));color:var(--at)}.tag.cr{background:color-mix(in srgb,var(--cr) 16%,var(--pn));color:var(--cr)}
td input{min-height:36px;padding:0 8px}.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{min-height:34px;padding:0 10px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:16px}
.mut{color:var(--mut)}.sm{font-size:13px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:0 0 14px}
.pn>h2{font-size:15px;margin:0 0 12px;display:flex;gap:8px;align-items:baseline}
.sem{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;margin-bottom:14px;font-weight:600}
.sem.ok{background:color-mix(in srgb,var(--ok) 14%,var(--pn));color:var(--ok)}.sem.at{background:color-mix(in srgb,var(--at) 16%,var(--pn));color:var(--at)}.sem.cr{background:color-mix(in srgb,var(--cr) 14%,var(--pn));color:var(--cr)}
.al{list-style:none;margin:0;padding:0}.al li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}.al li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:var(--mut)}.dot.ok,.dot.running{background:var(--ok)}.dot.atencao,.dot.created{background:var(--at)}.dot.critico,.dot.restarting,.dot.exited,.dot.dead{background:var(--cr)}.dot.info{background:var(--ac)}
.vm{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px}
.gs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g b{font-size:24px;display:block}.bar{height:8px;border-radius:99px;background:var(--trk);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}.bar i.at{background:var(--at)}.bar i.cr{background:var(--cr)}
svg.sp{width:100%;height:46px;display:block;margin-top:8px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--ln);vertical-align:top}th{font-weight:600;color:var(--mut);font-size:13px;border-top:0}
.tw{overflow-x:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.err{color:var(--cr);min-height:22px}
@media(max-width:820px){.vm,.cols{grid-template-columns:1fr}.gs{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:480px){.gs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const gb=b=>b==null?'—':(b/1073741824).toFixed(1)+' GB',pct=(a,b)=>a==null||!b?null:a/b*100,dt=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const dur=s=>{if(s==null)return'—';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return d?`${d} d ${h} h`:`${h} h ${Math.floor(s%3600/60)} min`};
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='entrar'){login();throw new Error('sessão')}if(!r.ok)throw new Error(j.erro||r.status);return j}
function login(m){clearTimeout(window._t);$('#app').innerHTML=`<div class="login pn"><h1 style="margin:0 0 4px;font-size:22px">Monitor IAVTech</h1><p class="mut sm" style="margin-top:0">Acesso restrito. Senha e código do autenticador.</p>
 <label for="s" class="sm">Senha</label><input id="s" type="password" autocomplete="current-password"><label for="c" class="sm" style="display:block;margin-top:10px">Código de 6 dígitos</label><input id="c" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
 <p class="err" id="e">${esc(m||'')}</p><button class="p" style="width:100%" onclick="entrar()">Entrar</button></div>`;$('#c').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});$('#s').focus()}
async function entrar(){try{await api('entrar',{senha:$('#s').value,codigo:$('#c').value});ABA==='plat'?plataforma():painel()}catch(e){$('#e').textContent=e.message}}
function spark(pts,max,cor){if(!pts||pts.length<2)return'';const t0=pts[0][0],t1=pts[pts.length-1][0],mx=max||Math.max(...pts.map(p=>p[1]),1);
 const d=pts.map((p,i)=>`${i?'L':'M'}${((p[0]-t0)/(t1-t0||1)*300).toFixed(1)} ${(44-Math.max(0,p[1])/mx*40).toFixed(1)}`).join('');return `<svg class="sp" viewBox="0 0 300 46" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${cor||'var(--ac)'}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
const nivel=p=>p==null?'':p>90?'cr':p>75?'at':'';
function gauge(nome,p,txt){return `<div class="g"><span class="mut sm">${nome}</span><b>${p==null?'—':p.toFixed(0)+'%'}</b><span class="sm mut">${txt}</span><div class="bar"><i class="${nivel(p)}" style="width:${Math.min(100,p||0)}%"></i></div></div>`}
async function painel(){let s;try{s=await api('estado')}catch(e){return}
 const crit=s.alertas.filter(a=>a.nivel==='critico'),at=s.alertas.filter(a=>a.nivel==='atencao');
 const sem=crit.length?['cr',`${crit.length} problema(s) crítico(s)`]:at.length?['at',`${at.length} ponto(s) de atenção`]:['ok','Tudo funcionando'];
 $('#app').innerHTML=`<div class="top"><h1>Monitor IAVTech</h1>${abas('infra')}<span class="mut sm">coletado ${dt(s.coletado_em)} · a cada ${Math.round(s.intervalo_s/60)} min</span><button onclick="atualizar(this)">Atualizar agora</button><button onclick="sair()">Sair</button></div><main>
 <div class="sem ${sem[0]}" role="status"><span class="dot ${sem[0]==='ok'?'ok':sem[0]==='at'?'atencao':'critico'}" style="margin:0"></span>${sem[1]}</div>
 ${s.alertas.length?`<div class="pn"><h2>Alertas</h2><ul class="al">${s.alertas.map(a=>`<li><span class="dot ${a.nivel}"></span><span>${esc(a.texto)}</span></li>`).join('')}</ul></div>`:''}
 ${s.vms.map(v=>{const pr=pct(v.ram&&v.ram.v,v.memoria_mb*1048576),pd=pct(v.disco&&v.disco.v,v.disco_mb*1048576);return `<section class="pn"><h2><span class="dot ${v.estado==='running'?'ok':'critico'}"></span>${esc(v.nome)} <span class="mut sm">${esc(v.plano)} · ${esc(v.ip||'')} · ${esc(v.so||'')}</span></h2>
  <div class="vm"><div><div class="sm mut">Estado</div><b>${v.estado==='running'?'Ligado':esc(v.estado)}</b><div class="sm mut" style="margin-top:8px">Ligado há</div><b>${dur(v.uptime&&v.uptime.v)}</b>
   <div class="sm mut" style="margin-top:8px">Backups da Hostinger</div>${v.backups.length?v.backups.slice(0,3).map(b=>`<div class="sm">${dt(b.criado_em)}</div>`).join(''):'<div class="sm mut">nenhum listado</div>'}
   ${v.erros.length?`<p class="sm" style="color:var(--at)">${v.erros.map(esc).join('<br>')}</p>`:''}</div>
   <div><div class="gs">${gauge('CPU',v.cpu&&v.cpu.v,v.cpus+' núcleos')}${gauge('Memória',pr,gb(v.ram&&v.ram.v)+' de '+gb(v.memoria_mb*1048576))}${gauge('Disco',pd,gb(v.disco&&v.disco.v)+' de '+gb(v.disco_mb*1048576))}</div>
   <div class="sm mut" style="margin-top:12px">CPU nas últimas 24 h</div>${spark(v.series.cpu,100)}</div></div>
  ${v.projetos.map(p=>`<h3 style="font-size:14px;margin:16px 0 4px">Projeto Docker <b>${esc(p.nome)}</b> <span class="mut sm">${esc(p.status||'')}</span></h3><div class="tw"><table><tr><th>Container</th><th>Situação</th><th>Portas abertas</th><th>CPU</th><th>Memória</th></tr>
   ${p.containers.map(c=>`<tr><td><span class="dot ${esc(c.estado)}" style="display:inline-block;margin:0 6px 0 0"></span>${esc(c.nome)}<div class="sm mut">${esc(String(c.imagem).slice(0,48))}</div></td><td>${esc(c.status)}</td><td class="sm">${c.portas.length?c.portas.map(x=>x.startsWith('pública')?`<b style="color:var(--at)">${esc(x)}</b>`:esc(x)).join('<br>'):'<span class="mut">nenhuma</span>'}</td><td>${c.cpu!=null?c.cpu.toFixed(1)+'%':'—'}</td><td>${c.mem!=null?(c.mem/1048576).toFixed(0)+' MB':'—'}</td></tr>`).join('')}</table></div>${p.erro?`<p class="sm" style="color:var(--at)">${esc(p.erro)}</p>`:''}`).join('')}</section>`}).join('')}
 <div class="cols"><section class="pn"><h2>Endereços públicos</h2><table><tr><th>Endereço</th><th>Resposta</th><th>7 dias</th></tr>${s.urls.map(u=>{const h=(s.historico_urls[u.url]||[]),up=h.length?h.filter(x=>x[1]>=0).length/h.length*100:null;
   return `<tr><td><span class="dot ${u.ok?'ok':'critico'}" style="display:inline-block;margin:0 6px 0 0"></span><a href="${esc(u.url)}" target="_blank" rel="noopener" style="color:var(--tx)">${esc(u.url.replace(/^https?:\/\//,''))}</a></td><td>${u.ok?u.ms+' ms':esc(u.status||u.erro)}</td><td>${up==null?'—':up.toFixed(up===100?0:2)+'% no ar'}${spark(h.map(x=>[x[0],Math.max(0,x[1])]),null,'var(--ok)')}</td></tr>`}).join('')}</table></section>
 <section class="pn"><h2>Domínios e assinaturas</h2>${Array.isArray(s.dominios)?(s.dominios.length?`<table><tr><th>Domínio</th><th>Situação</th><th>Expira</th></tr>${s.dominios.map(d=>`<tr><td>${esc(d.dominio)}</td><td>${esc(d.status)}</td><td>${dt(d.expira_em).slice(0,8)}</td></tr>`).join('')}</table>`:'<p class="mut sm">Nenhum domínio na Hostinger.</p>'):`<p class="sm" style="color:var(--at)">Domínios: ${esc(s.dominios&&s.dominios.erro||'—')}</p>`}
  ${Array.isArray(s.assinaturas)?`<table style="margin-top:10px"><tr><th>Assinatura</th><th>Situação</th><th>Vence</th></tr>${s.assinaturas.map(a=>`<tr><td>${esc(a.nome)}</td><td>${esc(a.status)}${a.renova?' · renova sozinha':''}</td><td>${dt(a.expira_em).slice(0,8)}</td></tr>`).join('')}</table>`:`<p class="sm" style="color:var(--at)">Assinaturas: ${esc(s.assinaturas&&s.assinaturas.erro||'—')}</p>`}
  ${Array.isArray(s.sites)&&s.sites.length?`<table style="margin-top:10px"><tr><th>Site de hospedagem</th><th>Tipo</th><th></th></tr>${s.sites.map(w=>`<tr><td>${esc(w.dominio)}</td><td>${esc(w.tipo)}</td><td>${w.ativo?'ativo':'suspenso'}</td></tr>`).join('')}</table>`:''}</section></div>
 <section class="pn"><h2>Histórico de alertas</h2>${s.historico_alertas.length?`<ul class="al">${s.historico_alertas.map(a=>`<li><span class="dot ${a.nivel}"></span><span><span class="sm mut">${dt(a.t)}</span> ${esc(a.texto)}</span></li>`).join('')}</ul>`:'<p class="mut sm">Nenhum alerta registrado ainda.</p>'}</section></main>`;
 clearTimeout(window._t);window._t=setTimeout(()=>ABA==='infra'&&painel(),60000)}
let ABA='infra';const abas=a=>`<div class="tabs" role="tablist"><button class="${a==='infra'?'on':''}" onclick="ABA='infra';painel()">Infraestrutura</button><button class="${a==='plat'?'on':''}" onclick="ABA='plat';plataforma()">Clientes MedNexo</button></div>`;
const brl=v=>v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function situ(c){if(c.suspensa_em)return['cr','suspensa'];if(c.atraso_desde)return['cr','em atraso desde '+dt(c.atraso_desde).slice(0,8)];if(c.assinatura_status==='ativa')return['ok','assinante · '+(c.assinatura_plano||'')];
 if(c.plano==='teste'){const d=Math.ceil((new Date(c.teste_ate)-Date.now())/864e5)+1;return d>0?['at',`teste · ${d} dia(s)`]:['cr','teste vencido']}return['',c.plano||'—']}
function barras(m){const mx=Math.max(1,...m.map(x=>+x.recebido_assinaturas));return `<svg viewBox="0 0 ${m.length*40} 120" style="width:100%;height:140px" role="img" aria-label="Recebido por mês">${m.map((x,i)=>{const h=+x.recebido_assinaturas/mx*90;return `<rect x="${i*40+8}" y="${100-h}" width="24" height="${Math.max(h,1)}" rx="3" fill="var(--ac)"><title>${x.mes}: ${brl(x.recebido_assinaturas)} · ${x.novos} novo(s)</title></rect><text x="${i*40+20}" y="116" font-size="9" text-anchor="middle" fill="var(--mut)">${x.mes.slice(5)}/${x.mes.slice(2,4)}</text>`}).join('')}</svg>`}
async function plataforma(msgTxt){clearTimeout(window._t);let d;try{d=await api('plataforma')}catch(e){if(e.message!=='sessão')$('#app').innerHTML=`<div class="top"><h1>Monitor IAVTech</h1>${abas('plat')}</div><main><div class="pn" style="color:var(--cr)">${esc(e.message)}</div></main>`;return}
 const k=d.indicadores,f=(window._f||'').toLowerCase();const cl=d.clientes.filter(c=>!f||(c.nome+' '+(c.contato_email||'')).toLowerCase().includes(f));
 $('#app').innerHTML=`<div class="top"><h1>Monitor IAVTech</h1>${abas('plat')}<span class="mut sm">${d.clientes.length} organização(ões)</span><button onclick="plataforma()">Atualizar</button><button onclick="sair()">Sair</button></div><main>
 ${msgTxt?`<div class="sem ok" role="status">${esc(msgTxt)}</div>`:''}
 <div class="kpis"><div class="kpi"><span class="mut sm">Receita recorrente (MRR)</span><b>${brl(k.mrr)}</b><span class="sm mut">${k.clientes_pagantes} assinante(s)</span></div>
  <div class="kpi"><span class="mut sm">Em teste grátis</span><b>${k.em_teste}</b><span class="sm mut">${k.teste_vencido} com teste vencido</span></div>
  <div class="kpi"><span class="mut sm">Inadimplentes</span><b style="color:${k.inadimplentes?'var(--cr)':'inherit'}">${k.inadimplentes}</b><span class="sm mut">${k.suspensos} suspensa(s)</span></div>
  <div class="kpi"><span class="mut sm">Usuários ativos</span><b>${k.usuarios_ativos}</b><span class="sm mut">${k.usuarios_30d} entraram em 30 dias</span></div>
  <div class="kpi"><span class="mut sm">Teleconsultas pagas no mês</span><b>${k.teleconsultas_pagas_mes}</b><span class="sm mut">${brl(k.receita_teleconsulta_mes)} para a plataforma</span></div>
  <div class="kpi"><span class="mut sm">Pacientes na Área do Paciente</span><b>${k.pacientes_portal}</b><span class="sm mut">contas criadas</span></div></div>
 <section class="pn"><h2>Recebido de assinaturas por mês <span class="mut sm">últimos 12 meses · passe o mouse para ver os valores</span></h2>${barras(k.meses)}</section>
 <section class="pn"><h2>Clientes</h2><input placeholder="Buscar por nome ou e-mail" value="${esc(window._f||'')}" oninput="window._f=this.value;clearTimeout(window._b);window._b=setTimeout(plataforma,300)" style="max-width:360px;margin-bottom:8px"><div class="tw"><table><tr><th>Organização</th><th>Situação</th><th>Uso</th><th>Último acesso</th><th>Ações</th></tr>
 ${cl.map(c=>{const [cs,ct]=situ(c);return `<tr><td><b>${esc(c.nome)}</b><div class="sm mut">${esc(c.contato_email||'')} ${esc(c.contato_telefone||'')}</div><div class="sm mut">desde ${dt(c.criada_em).slice(0,8)}</div></td>
  <td><span class="tag ${cs}">${esc(ct)}</span>${c.assinatura_valor?`<div class="sm">${brl(c.assinatura_valor)}/mês</div>`:''}${c.suspensao_motivo?`<div class="sm mut">${esc(c.suspensao_motivo)}</div>`:''}</td>
  <td class="sm">${c.medicos} médico(s) · ${c.membros} usuário(s)<br>${c.hospitais} hospital(is) · ${c.pacientes} paciente(s)<br>${c.teleconsultas_pagas} teleconsulta(s) paga(s)</td><td class="sm">${c.ultimo_acesso?dt(c.ultimo_acesso):'nunca'}</td>
  <td><div class="acts">${c.plano==='teste'&&!c.assinatura_status?`<button onclick="teste('${c.id}')">Prorrogar teste</button>`:''}${c.suspensa_em?`<button onclick="reativar('${c.id}')">Reativar</button>`:`<button onclick="suspender('${c.id}','${esc(c.nome).replace(/'/g,'')}')">Suspender</button>`}</div></td></tr>`}).join('')}</table></div>
  <p class="sm mut">Este painel não mostra nem abre prontuários: só dados comerciais e contagens. Suspender deixa a conta em somente leitura, sem apagar nada; os médicos continuam consultando e exportando os prontuários.</p></section>
 <section class="pn"><h2>Planos <span class="mut sm">o preço vale para novas assinaturas; vazio = "fale conosco"</span></h2><div class="tw"><table><tr><th>Código</th><th>Nome</th><th>Preço mensal (R$)</th><th>Limite de médicos</th><th>Limite de hospitais</th><th>Ativo</th><th>Assinantes</th><th></th></tr>
  ${d.planos.map(p=>`<tr><td class="sm">${esc(p.id)}</td><td><input id="pn_${p.id}" value="${esc(p.nome)}"></td><td><input id="pp_${p.id}" inputmode="decimal" value="${p.preco??''}"></td><td><input id="pm_${p.id}" inputmode="numeric" value="${p.limite_medicos??''}" placeholder="ilimitado"></td><td><input id="ph_${p.id}" inputmode="numeric" value="${p.limite_hospitais??''}" placeholder="ilimitado"></td><td><input type="checkbox" id="pa_${p.id}" style="width:auto;min-height:0" ${p.ativo?'checked':''}></td><td>${p.clientes}</td><td><button onclick="salvaPlano('${p.id}')">Salvar</button></td></tr>`).join('')}</table></div></section>
 <div class="cols"><section class="pn"><h2>Faturas de assinatura</h2>${d.cobrancas.length?`<div class="tw"><table><tr><th>Cliente</th><th>Valor</th><th>Vencimento</th><th>Situação</th></tr>${d.cobrancas.map(c=>`<tr><td>${esc(c.organizacao)}</td><td>${brl(c.valor)}</td><td>${c.vencimento?dt(c.vencimento).slice(0,8):'—'}</td><td><span class="tag ${['RECEIVED','CONFIRMED','RECEIVED_IN_CASH'].includes(c.status)?'ok':c.status==='OVERDUE'?'cr':''}">${esc(c.status)}</span></td></tr>`).join('')}</table></div>`:'<p class="mut sm">Nenhuma fatura ainda.</p>'}</section>
 <section class="pn"><h2>Registro de ações deste painel</h2>${d.registro.length?`<ul class="al">${d.registro.map(r=>`<li><span class="dot info"></span><span><span class="sm mut">${dt(r.criado_em)}</span> ${esc(r.acao)} ${r.organizacao?'· '+esc(r.organizacao):''} <span class="sm mut">${esc(JSON.stringify(r.detalhes))}</span></span></li>`).join('')}</ul>`:'<p class="mut sm">Nenhuma ação registrada.</p>'}</section></div></main>`}
async function acao(p,b,ok){try{await api(p,b);plataforma(ok)}catch(e){alert(e.message)}}
function teste(org){const d=prompt('Prorrogar o teste grátis por quantos dias? (1 a 90)','7');if(d)acao('plataforma/teste',{org,dias:+d},'Teste prorrogado.')}
function suspender(org,n){const m=prompt(`Motivo da suspensão de ${n} (a conta fica em somente leitura; nada é apagado):`);if(m)acao('plataforma/suspender',{org,motivo:m},'Conta suspensa.')}
function reativar(org){if(confirm('Reativar esta conta?'))acao('plataforma/reativar',{org},'Conta reativada.')}
function salvaPlano(id){acao('plataforma/plano',{id,nome:$('#pn_'+id).value,preco:$('#pp_'+id).value.replace(',','.'),limite_medicos:$('#pm_'+id).value,limite_hospitais:$('#ph_'+id).value,ativo:$('#pa_'+id).checked},'Plano salvo.')}
async function atualizar(b){b.disabled=true;b.textContent='Atualizando…';try{await api('atualizar',{})}catch(e){}painel()}
async function sair(){await api('sair',{}).catch(()=>{});login()}
painel();
</script>
