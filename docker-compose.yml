# MEDNEXO - ambiente de TESTE (dados ficticios, sem HTTPS). Senhas vem de variaveis de ambiente (nunca no repositorio).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mednexo
      POSTGRES_HOST_AUTH_METHOD: trust   # banco so na rede interna do compose (porta NAO publicada)
    volumes:
      - dbdata:/var/lib/postgresql/data
  app:
    build: https://github.com/pepoabreu/mednexo-teste.git#main
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8086:8080"
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: mednexo
      PW_MEDICO: ${PW_MEDICO:?defina PW_MEDICO}
      PW_ASSIST: ${PW_ASSIST:?defina PW_ASSIST}
      PW_ENF: ${PW_ENF:?defina PW_ENF}
      PW_ADM: ${PW_ADM:?defina PW_ADM}
      PW_AUD: ${PW_AUD:?defina PW_AUD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-claude-sonnet-5-5}
      CODIGO_CONVITE: ${CODIGO_CONVITE:-}
      ADMIN_EXTRA_EMAIL: ${ADMIN_EXTRA_EMAIL:-}
      ADMIN_EXTRA_SENHA: ${ADMIN_EXTRA_SENHA:-}
      GESTOR_EMAIL: ${GESTOR_EMAIL:-}
      GESTOR_SENHA: ${GESTOR_SENHA:-}
      GESTOR_NOME: ${GESTOR_NOME:-}
      GESTOR_ORG: ${GESTOR_ORG:-}
      GESTOR_CRM: ${GESTOR_CRM:-}
      GESTOR_UF: ${GESTOR_UF:-}
      TURN_SECRET: ${TURN_SECRET:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_AMBIENTE: ${ASAAS_AMBIENTE:-sandbox}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_CRIPTO: ${ASAAS_CRIPTO:-}
      ASAAS_EMAIL_AVISOS: ${ASAAS_EMAIL_AVISOS:-}
      ASAAS_WALLET_ID: ${ASAAS_WALLET_ID:-}
      URL_PUBLICA: ${URL_PUBLICA:-}
      TAXA_PLATAFORMA: ${TAXA_PLATAFORMA:-10}
      PRECO_INDIVIDUAL: ${PRECO_INDIVIDUAL:-}
      PRECO_EQUIPE: ${PRECO_EQUIPE:-}
      PRECO_CLINICA: ${PRECO_CLINICA:-}
      TURN_HOST: ${TURN_HOST:-}
  web:
    build:
      context: https://github.com/pepoabreu/mednexo-teste.git#main
      dockerfile: Dockerfile.site
    restart: unless-stopped
    ports:
      - "8085:80"
  # Tunel nomeado da Cloudflare (endereco fixo com HTTPS). O token vem do ambiente do servidor, nunca do repositorio.
  # Rotas publicas (painel da Cloudflare): mednexo.iavtech.com.br -> http://web:80 ; app.mednexo.iavtech.com.br -> http://app:8080
  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [app, web]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?defina CF_TUNNEL_TOKEN}
  # Retransmissao de video (TURN) para teleconsulta em redes moveis/corporativas. Credenciais temporarias geradas pelo app.
  turn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: ["-n", "--log-file=stdout", "--listening-port=3478", "--min-port=49160", "--max-port=49200", "--use-auth-secret", "--static-auth-secret=${TURN_SECRET:?defina TURN_SECRET}", "--realm=mednexo.iavtech.com.br", "--external-ip=${TURN_HOST:?defina TURN_HOST}", "--fingerprint", "--no-cli", "--no-tls", "--no-dtls", "--no-multicast-peers", "--denied-peer-ip=10.0.0.0-10.255.255.255", "--denied-peer-ip=172.16.0.0-172.31.255.255", "--denied-peer-ip=192.168.0.0-192.168.255.255", "--denied-peer-ip=127.0.0.0-127.255.255.255", "--denied-peer-ip=0.0.0.0-0.255.255.255"]
volumes:
  dbdata:
