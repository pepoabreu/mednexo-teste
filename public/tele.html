<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a6b">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/assets/icon-192.png">
<title>MedNexo — Teleconsulta</title>
<style>
:root{--bg:#f2f6fb;--card:#fff;--tx:#0b1f45;--mut:#4b5f80;--br:#d8e2f0;--pri:#1565d8;--navy:#0b2a6b;--ok:#0f7a4f;--bad:#b42318;--me:#e3edfc;--ot:#ffffff}
@media(prefers-color-scheme:dark){:root{--bg:#08152e;--card:#10264d;--tx:#e8eefb;--mut:#9db0d3;--br:#223a68;--pri:#4d94ff;--me:#173a72;--ot:#13284f}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;background:linear-gradient(100deg,#0b2a6b,#1565d8 75%,#14b8b0 140%);color:#fff}
header .logo{background:#fff;border-radius:9px;padding:3px;display:inline-flex}header .logo img{height:26px;display:block}
header b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}header .st{margin-left:auto;font-size:13px;opacity:.95;white-space:nowrap;flex-shrink:0}
html,body{overflow-x:hidden}.sala>*{min-width:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f5b400;margin-right:6px;vertical-align:middle}.dot.on{background:#3ddc84}.dot.off{background:#ff6b6b}
main{max-width:1200px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:16px;box-shadow:0 1px 3px #0b2a6b14}
h1{font-size:22px;margin:4px 0 8px}h2{font-size:17px;margin:0 0 8px}.mut{color:var(--mut);font-size:14px}
button{font:inherit;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);min-height:44px;padding:0 16px;cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.55;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #14b8b0;outline-offset:2px}
.sala{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:12px;height:calc(100dvh - 90px)}
.vid{position:relative;background:#06142e;border-radius:14px;overflow:hidden;min-height:240px}
#rv{width:100%;height:100%;object-fit:cover;background:#06142e}
#lv{position:absolute;right:10px;bottom:72px;width:28%;max-width:200px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:2px solid #ffffffaa;background:#0b1f45;transform:scaleX(-1)}
.vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfe0ff;text-align:center;padding:20px;font-size:15px;pointer-events:none}
.ctl{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ctl button{border-radius:999px;background:#ffffffe6;border:0;color:#0b1f45;min-width:48px;font-weight:600}.ctl button.off{background:#ffd6d6}.ctl button.bad{background:var(--bad);color:#fff}
.chat{display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 8px;min-height:160px}
.m{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--ot);border:1px solid var(--br);word-wrap:break-word;white-space:pre-wrap}
.m.eu{align-self:flex-end;background:var(--me);border-color:transparent}.m.sis{align-self:center;background:transparent;border:0;color:var(--mut);font-size:13px;text-align:center}
.m small{display:block;color:var(--mut);font-size:12px;margin-top:2px}.m a{color:var(--pri);font-weight:600}
.envio{display:flex;gap:8px;align-items:center;border-top:1px solid var(--br);padding-top:8px}
.envio input[type=text]{flex:1;min-width:0;min-height:44px;border:1px solid var(--br);border-radius:10px;padding:0 12px;font:inherit;background:var(--bg);color:var(--tx)}
.anexar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.anexar select{min-height:44px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit;padding:0 8px}
label.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--br);border-radius:10px;cursor:pointer;background:var(--card)}
.termo{max-width:640px;margin:16px auto}.termo ul{padding-left:20px;margin:8px 0}.termo li{margin:4px 0}
.ck{display:flex;gap:10px;align-items:flex-start;margin:14px 0}.ck input{width:20px;height:20px;margin-top:2px}
.err{background:#fde8e6;color:#7a1a12;border-radius:10px;padding:10px 12px;margin:8px 0}.okm{background:#e3f6ec;color:#0b5135;border-radius:10px;padding:10px 12px;margin:8px 0}
@media(max-width:820px){.sala{grid-template-columns:1fr;height:auto}.vid{height:56vh}.chat{height:60vh}main{padding:8px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><span class="logo"><img src="/assets/symbol.png" alt=""></span><b>MedNexo · Teleconsulta</b><span class="st" id="st"><span class="dot"></span>conectando…</span></header>
<main id="app"><div class="card">Carregando…</div></main>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const hm=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
// #m.<id> = médico (sessão por cookie) | #<id>.<token> = paciente (link)
const H=decodeURIComponent(location.hash.slice(1));
const MEDICO=H.startsWith('m.');const ID=MEDICO?H.slice(2):H.split('.')[0];const CHAVE=MEDICO?null:H;
const EU=MEDICO?'medico':'paciente';
const API=MEDICO?{sala:'/api/tele/sala?id='+ID,ev:d=>`/api/tele/eventos?id=${ID}&desde=${d}`,msg:'/api/tele/msg',sinal:'/api/tele/sinal',anexo:'/api/tele/anexo',baixa:a=>`/api/tele/anexo?id=${ID}&aid=${a}`}
 :{sala:'/api/tele-p/sala',ev:d=>`/api/tele-p/eventos?desde=${d}`,msg:'/api/tele-p/msg',sinal:'/api/tele-p/sinal',anexo:'/api/tele-p/anexo',baixa:a=>`/api/tele-p/anexo?aid=${a}`,consentir:'/api/tele-p/consentir'};
async function req(url,body){const h={};if(CHAVE)h['X-Tele-Chave']=CHAVE;if(body){h['Content-Type']='application/json'}
 const r=await fetch(url,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
 const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.erro||('Erro '+r.status));e.status=r.status;throw e}return j}
function estado(t,c){$('#st').innerHTML=`<span class="dot ${c||''}"></span>${esc(t)}`}
let S=null,seq=0,pc=null,local=null,pend=[],ativo=true,mic=true,cam=true,anexosById={};

async function inicio(){
 if(!ID||(!MEDICO&&!CHAVE.includes('.'))){$('#app').innerHTML='<div class="card termo"><h1>Link inválido</h1><p>Peça ao seu médico um novo link de teleconsulta.</p></div>';estado('link inválido','off');return}
 try{S=await req(API.sala)}catch(e){$('#app').innerHTML=`<div class="card termo"><h1>Não foi possível abrir a teleconsulta</h1><p>${esc(e.message)}</p>${e.status===401&&MEDICO?'<p><a href="/sistema/">Entre no MedNexo</a> e abra a sala de novo.</p>':''}</div>`;estado('indisponível','off');return}
 if(!MEDICO&&!S.tele.consentimento_em)return termo();
 if(S.tele.status==='encerrada')return encerrada();
 entrada();
}
function termo(){estado('aguardando aceite');
 $('#app').innerHTML=`<div class="card termo"><h1>Olá${S.tele.paciente_primeiro_nome?', '+esc(S.tele.paciente_primeiro_nome):''}!</h1>
 <p>Você foi convidado(a) para uma <b>teleconsulta</b> com <b>${esc(S.tele.medico)}</b>.</p>
 <h2>Termo de consentimento</h2><ul>
 <li>O atendimento será feito por vídeo, áudio e chat pela internet, seguindo as regras do Conselho Federal de Medicina para telemedicina.</li>
 <li>Procure um local reservado, com boa conexão. A chamada <b>não é gravada</b>; as mensagens e os arquivos enviados ficam registrados no seu prontuário.</li>
 <li>Seus dados são tratados com sigilo médico e conforme a LGPD.</li>
 <li>O médico pode interromper a teleconsulta e indicar atendimento presencial sempre que necessário, e você também pode pedir atendimento presencial.</li>
 <li>Em caso de <b>emergência</b>, não use esta tela: ligue <b>192 (SAMU)</b> ou procure o pronto-socorro mais próximo.</li></ul>
 <label class="ck"><input type="checkbox" id="ac"><span>Li e concordo com a realização da teleconsulta.</span></label><div id="tm"></div>
 <button class="p" onclick="aceitar()">Concordo e quero entrar</button></div>`}
async function aceitar(){if(!$('#ac').checked){$('#tm').innerHTML='<div class="err">Marque a caixa para concordar com o termo.</div>';return}
 try{await req(API.consentir,{aceito:true});S=await req(API.sala);entrada()}catch(e){$('#tm').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
function entrada(){estado('pronto para entrar');
 $('#app').innerHTML=`<div class="card termo"><h1>${MEDICO?'Sala de teleconsulta':'Tudo pronto'}</h1><p>Ao entrar, o navegador vai pedir permissão para usar a <b>câmera</b> e o <b>microfone</b>. Toque em <b>Permitir</b>.</p>
 <p class="mut">Se preferir, dá para entrar só com o chat e enviar exames, receitas e laudos.</p><div id="em"></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="p" onclick="entrar(true)">Entrar com vídeo</button><button onclick="entrar(false)">Entrar só no chat</button></div></div>`}
async function entrar(comVideo){
 if(comVideo){try{local=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){$('#em').innerHTML=`<div class="err">Não foi possível usar a câmera/microfone (${esc(e.name==='NotAllowedError'?'permissão negada':e.message)}). Libere o acesso nas configurações do navegador ou entre só no chat.</div>`;return}}
 sala();if(local){$('#lv').srcObject=local}else{$('#lv').style.display='none';$('#bmic').disabled=true;$('#bcam').disabled=true}
 S.mensagens.forEach(mostraMsg);S.anexos.forEach(a=>anexosById[a.id]=a);seq=S.seq;
 laco();sinal('pronto');
}
function sala(){
 $('#app').innerHTML=`<div class="sala"><section class="vid" aria-label="Vídeo"><video id="rv" autoplay playsinline></video><div class="vmsg" id="vmsg">Aguardando ${MEDICO?'o paciente':'o médico'} entrar na chamada…</div>
 <video id="lv" autoplay playsinline muted></video>
 <div class="ctl"><button id="bmic" onclick="alterna('mic')" aria-label="Microfone">🎤 Mic</button><button id="bcam" onclick="alterna('cam')" aria-label="Câmera">📷 Câmera</button>
 ${MEDICO?'<button class="bad" onclick="encerrar()">Encerrar consulta</button>':'<button class="bad" onclick="sair()">Sair</button>'}</div></section>
 <section class="card chat" aria-label="Chat"><h2>Chat ${MEDICO?'com o paciente':'com o médico'}</h2><div id="msgs" aria-live="polite"></div>
 <div class="envio"><input type="text" id="tx" placeholder="Escreva uma mensagem" maxlength="4000" onkeydown="if(event.key==='Enter')envia()"><button class="p" onclick="envia()">Enviar</button></div>
 <div class="anexar"><select id="cat" aria-label="Tipo do arquivo"><option value="exame">Exame</option><option value="receita">Receita</option><option value="laudo">Laudo</option><option value="outro">Outro</option></select>
 <label class="btn">📎 Anexar arquivo<input type="file" id="fa" accept="application/pdf,image/*" style="display:none" onchange="anexa(this)"></label>
 <label class="btn">📷 Foto<input type="file" accept="image/*" capture="environment" style="display:none" onchange="anexa(this)"></label></div><div id="am" class="mut"></div></section></div>`}
function mostraMsg(m){const box=$('#msgs');if(!box||document.getElementById('m_'+m.id))return;const d=document.createElement('div');d.id='m_'+m.id;
 d.className='m '+(m.autor==='sistema'?'sis':m.autor===EU?'eu':'');
 d.innerHTML=esc(m.texto)+(m.anexo_id?` <a href="#" onclick="abre('${m.anexo_id}');return false">abrir</a>`:'')+(m.autor!=='sistema'?`<small>${m.autor===EU?'Você':m.autor==='medico'?'Médico':'Paciente'} · ${hm(m.criado_em)}</small>`:'');
 box.appendChild(d);box.scrollTop=box.scrollHeight}
async function envia(){const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';try{mostraMsg(await req(API.msg,{id:ID,texto:t}))}catch(e){$('#tx').value=t;aviso(e.message)}}
function aviso(t,ok){$('#am').innerHTML=`<div class="${ok?'okm':'err'}">${esc(t)}</div>`;setTimeout(()=>{if($('#am'))$('#am').innerHTML=''},6000)}
async function anexa(inp){const f=inp.files[0];inp.value='';if(!f)return;if(f.size>10*1024*1024)return aviso('Arquivo acima de 10 MB.');
 $('#am').textContent='Enviando '+f.name+'…';try{const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
 const a=await req(API.anexo,{id:ID,nome:f.name,mime:f.type||'application/octet-stream',categoria:$('#cat').value,base64:b64});anexosById[a.id]=a;if(a.msg)mostraMsg(a.msg);aviso('Arquivo enviado.',1)}catch(e){aviso(e.message)}}
async function abre(aid){try{const h={};if(CHAVE)h['X-Tele-Chave']=CHAVE;const r=await fetch(API.baixa(aid),{headers:h,credentials:'same-origin'});if(!r.ok)throw new Error('Não foi possível abrir o arquivo.');
 const u=URL.createObjectURL(await r.blob());window.open(u,'_blank')||(location.href=u)}catch(e){aviso(e.message)}}
function alterna(k){if(!local)return;if(k==='mic'){mic=!mic;local.getAudioTracks().forEach(t=>t.enabled=mic);$('#bmic').classList.toggle('off',!mic);$('#bmic').textContent=mic?'🎤 Mic':'🔇 Mudo'}
 else{cam=!cam;local.getVideoTracks().forEach(t=>t.enabled=cam);$('#bcam').classList.toggle('off',!cam);$('#bcam').textContent=cam?'📷 Câmera':'🚫 Câmera'}}
// ---------- WebRTC (o médico sempre faz a oferta; o paciente responde) ----------
async function sinal(tipo,dados){try{await req(API.sinal,{id:ID,tipo,dados})}catch(e){if(e.status===409||e.status===410)return encerrada();console.warn(e)}}
function novaConexao(){if(pc){try{pc.close()}catch(_){}}
 pc=new RTCPeerConnection({iceServers:S.ice});pend=[];
 if(local)local.getTracks().forEach(t=>pc.addTrack(t,local));else{pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'})}
 pc.onicecandidate=e=>{if(e.candidate)sinal('ice',e.candidate.toJSON())};
 pc.ontrack=e=>{const rv=$('#rv');if(rv&&rv.srcObject!==e.streams[0]){rv.srcObject=e.streams[0]}$('#vmsg').textContent=''};
 pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==='connected')estado('em chamada','on');else if(s==='connecting')estado('conectando vídeo…');else if(s==='failed'){estado('falha no vídeo','off');$('#vmsg').textContent='A conexão de vídeo falhou. O chat continua funcionando.';if(MEDICO)setTimeout(()=>oferta(),2000)}else if(s==='disconnected')estado('conexão instável','off')};
 return pc}
async function oferta(){novaConexao();const o=await pc.createOffer();await pc.setLocalDescription(o);sinal('offer',pc.localDescription.toJSON())}
async function trata(ev){
 if(ev.tipo==='msg')return mostraMsg(ev.dados);
 if(ev.tipo==='anexo'){anexosById[ev.dados.id]=ev.dados;return}
 if(ev.tipo==='estado'){if(ev.dados.status==='encerrada')return encerrada();if(ev.dados.consentimento&&MEDICO)estado('paciente aceitou o termo');return}
 if(ev.tipo!=='sinal')return;const {tipo,dados}=ev.dados;
 if(tipo==='pronto'){if(MEDICO)await oferta();else sinal('pronto');return}
 if(tipo==='offer'&&!MEDICO){novaConexao();await pc.setRemoteDescription(dados);for(const c of pend)await pc.addIceCandidate(c).catch(()=>{});pend=[];const a=await pc.createAnswer();await pc.setLocalDescription(a);sinal('answer',pc.localDescription.toJSON());return}
 if(tipo==='answer'&&MEDICO&&pc){await pc.setRemoteDescription(dados);for(const c of pend)await pc.addIceCandidate(c).catch(()=>{});pend=[];return}
 if(tipo==='ice'){if(pc&&pc.remoteDescription)await pc.addIceCandidate(dados).catch(()=>{});else pend.push(dados);return}
 if(tipo==='hangup'){if(pc){pc.close();pc=null}$('#rv').srcObject=null;$('#vmsg').textContent=(MEDICO?'O paciente':'O médico')+' saiu da chamada.';estado('aguardando','')}
}
async function laco(){while(ativo){try{const r=await req(API.ev(seq));seq=r.seq;for(const e of r.eventos)await trata(e).catch(console.warn);
  if(!pc||pc.connectionState!=='connected')estado(r.online?(MEDICO?'paciente na sala':'médico na sala'):(MEDICO?'aguardando o paciente':'aguardando o médico'),r.online?'':'')}
 catch(e){if(e.status===410||e.status===409)return encerrada();if(e.status===401&&MEDICO){estado('sessão expirada','off');return}await new Promise(r=>setTimeout(r,2500))}}}
function paraMidia(){if(local)local.getTracks().forEach(t=>t.stop());if(pc){try{pc.close()}catch(_){}}pc=null}
async function encerrar(){if(!confirm('Encerrar a teleconsulta? O link do paciente deixará de funcionar.'))return;await sinal('hangup');try{await req('/api/tele/encerrar',{id:ID})}catch(e){alert(e.message)}encerrada()}
async function sair(){await sinal('hangup');ativo=false;paraMidia();$('#app').innerHTML='<div class="card termo"><h1>Você saiu da chamada</h1><p>Para voltar, abra o link de novo enquanto a consulta estiver ativa.</p><button class="p" onclick="location.reload()">Voltar para a sala</button></div>';estado('fora da sala','off')}
function encerrada(){ativo=false;paraMidia();$('#app').innerHTML=`<div class="card termo"><h1>Teleconsulta encerrada</h1><p>${MEDICO?'Registre a evolução no prontuário do paciente. Os arquivos e o chat ficam disponíveis na aba Telemedicina da internação.':'Obrigado. Siga as orientações do seu médico.'}</p>${MEDICO?'<button class="p" onclick="window.close()">Fechar</button>':''}</div>`;estado('encerrada','off')}
inicio();
</script>
</body>
</html>
