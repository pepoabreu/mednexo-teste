<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEDNEXO — Ambiente de teste</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#17212b;--mut:#5d6b7a;--br:#d8dee5;--pri:#0b6b63;--pri2:#0a5750;--bad:#b42318;--ok:#157347;--warn:#9a6700}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#18212a;--tx:#e8edf2;--mut:#93a1b0;--br:#2b3845;--pri:#2bb3a6;--pri2:#4ccabd;--bad:#ff8a80;--ok:#6fd49a;--warn:#e6b450}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.5px}header nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
header button{background:transparent;color:#fff;border:1px solid #ffffff66;padding:6px 12px;border-radius:6px;cursor:pointer}header button.on{background:#ffffff26}
.aviso{background:#fff3cd;color:#664d03;padding:6px 16px;font-size:13px;border-bottom:1px solid #ecd48a}
main{max-width:1200px;margin:16px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px}h3{margin:14px 0 6px;font-size:15px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--br);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:13px}
tr.lk{cursor:pointer}tr.lk:hover{background:#0b6b6312}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--br);border-radius:6px;background:var(--card);color:var(--tx);font:inherit}textarea{min-height:70px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.g2{grid-template-columns:1fr}}
button.p{background:var(--pri);color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit;margin-top:10px}button.p:hover{background:var(--pri2)}button.s{background:transparent;border:1px solid var(--br);color:var(--tx);padding:6px 10px;border-radius:6px;cursor:pointer}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--br)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.msg{padding:9px 12px;border-radius:6px;margin:10px 0;background:#b4231815;color:var(--bad);border:1px solid #b4231855;white-space:pre-wrap}.msg.good{background:#15734515;color:var(--ok);border-color:#15734555}
.login{max-width:380px;margin:60px auto}code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}
.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}@media(max-width:520px){.hg{grid-template-columns:1fr}}.hc{margin:0}.hh{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.bar{width:90px;height:8px;background:var(--br);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.pc{display:flex;justify-content:space-between;gap:8px;padding:9px;border:1px solid var(--br);border-radius:8px;margin-top:8px;cursor:pointer;flex-wrap:wrap}.pc:hover{border-color:var(--pri)}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}button.on2{background:var(--pri);color:#fff;border-color:var(--pri)}.r-alto,.r-iminente{color:var(--bad);border-color:var(--bad)}.r-moderado{color:var(--warn)}.r-baixo{color:var(--ok)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.g3,.g4{grid-template-columns:1fr 1fr}}
.item{border:1px solid var(--br);border-radius:8px;padding:10px;margin:8px 0;background:var(--bg)}.al{border-left:4px solid var(--warn);padding:6px 10px;margin:6px 0;background:#9a670012}.al.grave,.al.contraindicada{border-color:var(--bad);background:#b4231812}
.thumb{max-width:100%;max-height:70vh;border:1px solid var(--br);border-radius:6px}.drop{border:2px dashed var(--br);border-radius:10px;padding:16px;text-align:center;color:var(--mut)}
.rg{display:flex;gap:10px;flex-wrap:wrap}.rg label{display:inline;margin:0;color:var(--tx)}.rg input{width:auto}.dom{border:1px solid var(--br);border-radius:8px;padding:8px;margin:6px 0}.sub{font-size:13px;color:var(--mut)}.tabs button.on2{background:var(--pri);color:#fff}
.ovl{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.ovl .card{max-width:460px;width:100%;margin:0;max-height:92vh;overflow:auto}.sit{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid}.sit.previsto{background:#eef2f4;border-color:#9fb0b8}.sit.faturado,.sit.parcial{background:#dfeafb;border-color:#8db4e6;color:#1b4f8f}.sit.vencido,.sit.parcial_vencido{background:#fdeceb;border-color:#d98a83;color:#8e1b12}.sit.recebido{background:#ddf1e4;border-color:#86c59c;color:#1b5e36}.sit.glosado,.sit.cancelado{background:#fff1dc;border-color:#e8b25e;color:#7a4a00}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
</style></head><body>
<div class="aviso">⚠ Ambiente de TESTE sem HTTPS — use <b>somente dados fictícios</b>. Não digite dados reais de pacientes.</div>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=s=>s?new Date(s).toLocaleString('pt-BR'):'—', fdd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('pt-BR'):'—';
let me=null, view='painel';
async function api(p,o){const r=await fetch(p,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});const j=await r.json().catch(()=>({}));
  if(r.status===401&&me){me=null;render();} if(!r.ok)throw new Error(j.erro||'Erro '+r.status);return j}
const msg=(t,good)=>`<div class="msg ${good?'good':''}">${esc(t)}</div>`;
function render(){ if(!me){$('#app').innerHTML=`<main class="login"><div class="card"><h2>MEDNEXO</h2><p class="mut">Prontuário eletrônico multi-hospital — ambiente de teste</p>
 <div id="m"></div><label for="em">E-mail</label><input id="em" autocomplete="username"><label for="se">Senha</label><input id="se" type="password" autocomplete="current-password">
 <button class="p" onclick="entrar()">Entrar</button>
 <p class="mut" style="margin-top:14px">Primeiro acesso? <a href="#" onclick="cad();return false">Criar meu usuário</a></p></div></main>`; $('#se').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()}); return}
 $('#app').innerHTML=`<header><b>MEDNEXO</b><nav>${[['painel','Painel'],['pacientes','Pacientes'],...(['medico_administrador','administrativo','admin_plataforma'].includes(me.papel)?[['hospitais','Hospitais']]:[]),...(me.papel.startsWith('medico')?[['repasse','Repasse']]:[]),['auditoria','Auditoria']].map(([k,n])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${n}</button>`).join('')}</nav>
 <span style="font-size:13px">${esc(me.nome)} · ${esc(me.papel)}</span><button onclick="sair()">Sair</button></header><main id="v"></main>`; go(view,true)}
async function entrar(){try{const j=await api('/api/login',{email:$('#em').value,senha:$('#se').value});me={...j,hospitais:[]};Object.assign(me,await api('/api/me'));view='painel';render()}catch(e){$('#m').innerHTML=msg(e.message)}}
function cad(){$('#app').innerHTML=`<main class="login"><div class="card"><h2>Criar usuário</h2><div id="m"></div>
 <label for="cn">Nome completo</label><input id="cn"><label for="ce">E-mail</label><input id="ce" autocomplete="username"><label for="cs">Senha (10+ caracteres)</label><input id="cs" type="password" autocomplete="new-password">
 <label for="cc">Código de convite</label><input id="cc" type="password"><button class="p" onclick="criar()">Criar e entrar</button> <button onclick="render()">Voltar</button></div></main>`}
async function criar(){try{await api('/api/cadastro',{nome:$('#cn').value,email:$('#ce').value,senha:$('#cs').value,convite:$('#cc').value});
 const j=await api('/api/login',{email:$('#ce').value,senha:$('#cs').value});me={...j,hospitais:[]};Object.assign(me,await api('/api/me'));view='painel';render()}catch(e){$('#m').innerHTML=msg(e.message)}}
async function sair(){await api('/api/logout',{});me=null;render()}
function go(v,k){view=v;if(!k)render();else({painel,pacientes,auditoria,repasse,hospitais})[v]()}
async function painel(){const [r,hs]=await Promise.all([api('/api/painel'),api('/api/hospitais')]);const sel=window._hf||'';
 const lista=hs.filter(h=>!sel||h.id===sel);
 $('#v').innerHTML=`<div class="card"><h2>Hospitais e pacientes internados</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="s ${!sel?'on2':''}" onclick="window._hf='';painel()">Todos (${r.length})</button>
 ${hs.map(h=>`<button class="s ${sel===h.id?'on2':''}" onclick="window._hf='${h.id}';painel()">${esc(h.nome_fantasia)} (${r.filter(x=>x.hospital===h.nome_fantasia).length})</button>`).join('')}</div></div>
 <div class="hg">${lista.map(h=>{const ps=r.filter(x=>x.hospital===h.nome_fantasia);const pct=h.leitos?Math.round(h.ocupados*100/h.leitos):0;
  return `<div class="card hc"><div class="hh"><div><h2 style="margin:0">${esc(h.nome_fantasia)}</h2><span class="mut">${ps.length} internado(s) · ${h.ocupados}/${h.leitos} leitos ocupados</span></div>
  <div class="bar" title="${pct}% ocupação"><i style="width:${pct}%"></i></div></div>
  ${ps.length?ps.map(x=>`<div class="pc" onclick="internacao('${x.internacao_id}')"><div><b>${esc(x.nome_completo)}</b> <span class="mut">${x.idade} anos</span><div class="mut">${esc(x.unidade||'')} · leito ${esc(x.leito||'—')} · Dx: ${esc(x.cid_principal||'—')}</div></div>
   <div class="chips">${x.risco_nivel?`<span class="tag r-${esc(x.risco_nivel)}">risco ${esc(x.risco_nivel)}</span>`:`<span class="tag warn">risco ${esc(x.risco_situacao.replace(/_/g,' '))}</span>`}
   ${x.alergias_status==='nao_avaliado'?'<span class="tag warn">alergias n/ avaliadas</span>':''}${x.qtd_pendencias?`<span class="tag bad">${x.qtd_pendencias} pend.</span>`:''}
   <span class="mut" style="font-size:12px">últ. evol.: ${fd(x.ultima_evolucao_em)}</span></div></div>`).join(''):'<p class="mut">Nenhum paciente internado neste hospital.</p>'}</div>`}).join('')}</div>`}
async function pacientes(){$('#v').innerHTML=`<div class="card"><h2>Pacientes</h2><div class="g2"><input id="bq" placeholder="Buscar por nome ou código (PAC-…)" oninput="lista()"><span></span></div><div id="pl"></div></div>
 <div class="card"><h2>Novo paciente</h2><div id="pm"></div><div class="g2"><div><label for="pn">Nome completo*</label><input id="pn"></div><div><label for="pm2">Nome da mãe</label><input id="pm2"></div>
 <div><label for="pd">Data de nascimento*</label><input id="pd" type="date"></div><div><label for="pc">CPF (opcional, válido)</label><input id="pc" maxlength="14"></div></div>
 <h3>Hospital onde o paciente será acompanhado</h3>${me.hospitais.length?`<div class="g3"><div><label for="ph">Hospital*</label><select id="ph" onchange="leitosPac()"><option value="">— só cadastrar, sem internar —</option>${me.hospitais.map(x=>`<option value="${x.id}">${esc(x.nome_fantasia)}</option>`).join('')}</select></div>
 <div><label for="pl">Leito</label><select id="pl"><option value="">(sem leito)</option></select></div><div><label for="pmo">Modalidade</label><select id="pmo"><option>voluntaria</option><option>involuntaria</option><option>compulsoria</option></select></div></div>
 <label for="pmt">Motivo da internação (obrigatório ao internar)</label><textarea id="pmt" style="min-height:50px"></textarea>`:`<p class="mut">Você ainda não cadastrou nenhum hospital. ${['medico_administrador','administrativo','admin_plataforma'].includes(me.papel)?'<a href="#" onclick="go(\'hospitais\');return false">Cadastrar hospital</a>':'Peça ao médico administrador.'}</p>`}
 <button class="p" onclick="novoPac()">Cadastrar</button></div>`;lista()}
async function leitosPac(){const h=$('#ph').value;if(!h){$('#pl').innerHTML='<option value="">(sem leito)</option>';return}const r=await api('/api/leitos?hospital_id='+h);$('#pl').innerHTML='<option value="">(sem leito)</option>'+r.map(l=>`<option value="${l.id}">${esc(l.unidade)} · ${esc(l.identificacao)}</option>`).join('')}
async function lista(){const r=await api('/api/pacientes?q='+encodeURIComponent($('#bq').value));$('#pl').innerHTML=r.length?`<table><tr><th>Código</th><th>Nome</th><th>Nasc.</th><th>Episódios</th></tr>`+r.map(p=>`<tr class="lk" onclick="paciente('${p.id}','${esc(p.nome_completo)}')"><td>${p.codigo}</td><td>${esc(p.nome_completo)}</td><td>${fdd(p.data_nascimento)}</td><td>${p.episodios}</td></tr>`).join('')+'</table>':'<p class="mut">Nenhum paciente.</p>'}
async function novoPac(){try{const hid=$('#ph')?$('#ph').value:'';if(hid&&!$('#pmt').value.trim())throw new Error('Informe o motivo da internação para internar no hospital selecionado.');
 const r=await api('/api/pacientes',{nome_completo:$('#pn').value,nome_mae:$('#pm2').value,data_nascimento:$('#pd').value,cpf:$('#pc').value});
 if(hid){try{const i=await api('/api/internacoes',{paciente_id:r.id,hospital_id:hid,leito_id:$('#pl').value||null,modalidade:$('#pmo').value,motivo:$('#pmt').value});return internacao(i.id)}catch(e){$('#pm').innerHTML=msg('Paciente '+r.codigo+' cadastrado, mas a internação falhou: '+e.message);lista();return}}
 $('#pm').innerHTML=msg('Cadastrado: '+r.codigo,1);lista()}catch(e){$('#pm').innerHTML=msg(e.message.includes('ux_paciente')?'Paciente já cadastrado (mesmo CPF ou nome+nascimento+mãe). Busque-o na lista.':e.message)}}
async function paciente(id,nome){const r=await api('/api/paciente?id='+id);const hs=me.hospitais;
 $('#v').innerHTML=`<div class="card"><h2>${esc(nome)}</h2><button class="s" onclick="go('pacientes')">← voltar</button>
 <h3>Episódios (internações)</h3>${r.episodios.length?`<table><tr><th>Código</th><th>Hospital</th><th>Situação</th><th>Admissão</th><th>Alta</th></tr>`+r.episodios.map(e=>`<tr class="lk" onclick="internacao('${e.internacao_id}')"><td>${esc(e.codigo||e.internacao_codigo||'')}</td><td>${esc(e.hospital)}</td><td>${esc(e.status||e.situacao||'')}</td><td>${fd(e.data_admissao)}</td><td>${fd(e.data_alta)}</td></tr>`).join('')+'</table>':'<p class="mut">Sem internações.</p>'}</div>
 <div class="card"><h2>Admitir em hospital</h2><div id="am"></div><div class="g2"><div><label>Hospital</label><select id="ah" onchange="leitos()">${hs.map(h=>`<option value="${h.id}">${esc(h.nome_fantasia)}</option>`).join('')}</select></div>
 <div><label>Leito</label><select id="al"></select></div><div><label>Modalidade</label><select id="amo"><option>voluntaria</option><option>involuntaria</option><option>compulsoria</option></select></div></div>
 <label>Motivo da internação*</label><textarea id="amt"></textarea><button class="p" onclick="admitir('${id}','${esc(nome)}')">Internar</button></div>
 <div class="card"><h2>Linha do tempo</h2>${r.linha.length?`<table>`+r.linha.map(l=>`<tr><td>${fd(l.ocorrido_em)}</td><td>${esc(l.evento)}</td><td>${esc(l.status||'')}</td></tr>`).join('')+'</table>':'<p class="mut">Sem eventos.</p>'}</div>`;leitos()}
async function leitos(){const r=await api('/api/leitos?hospital_id='+$('#ah').value);$('#al').innerHTML='<option value="">(sem leito)</option>'+r.map(l=>`<option value="${l.id}">${esc(l.unidade)} · ${esc(l.identificacao)}</option>`).join('')}
async function admitir(pid,nome){try{const r=await api('/api/internacoes',{paciente_id:pid,hospital_id:$('#ah').value,leito_id:$('#al').value||null,modalidade:$('#amo').value,motivo:$('#amt').value});internacao(r.id)}catch(e){$('#am').innerHTML=msg(e.message)}}
async function internacao(id){try{const r=await api('/api/internacao?id='+id),c=r.cab;
 $('#v').innerHTML=`<div class="card"><button class="s" onclick="go('painel')">← painel</button><h2 style="margin-top:10px">${esc(c.nome_completo)} <span class="mut">${esc(c.paciente_codigo)} · ${c.idade} anos · CPF ${esc(c.cpf_mascarado||'—')}</span></h2>
 <div class="g2"><div>${esc(c.hospital)} — ${esc(c.unidade||'')} ${esc(c.leito||'')}<br><span class="mut">${esc(c.internacao_codigo)} · ${esc(c.modalidade)} · ${esc(c.situacao_internacao)} · admissão ${fd(c.data_admissao)}</span></div>
 <div>Risco: ${c.risco_nivel?`<b>${esc(c.risco_nivel)}</b>`:`<span class="warn">${esc(c.risco_situacao.replace(/_/g,' '))}</span>`}<br>Alergias: ${c.alergias_status==='nao_avaliado'?'<span class="warn">não avaliado</span>':esc(c.alergias_status.replace(/_/g,' '))}
 ${me.papel.startsWith('medico')?` <button class="s" onclick="alerg('${c.paciente_id}','sem_alergias_conhecidas','${id}')">declarar sem alergias conhecidas</button>`:''}</div></div>
 ${r.pendencias.length?`<h3>Pendências</h3><ul>${r.pendencias.map(p=>`<li>${esc(p.tipo)} — ${esc(p.detalhe||'')}</li>`).join('')}</ul>`:''}</div>
 <div class="card"><div class="tabs" id="tabs">${[['anamnese','Anamnese'],['eem','Estado mental'],['risco','Risco'],['diag','Diagnósticos'],['evol','Evoluções'],['presc','Prescrições'],['docs','Documentos'],['exames','Exames'],...(me.papel.startsWith('medico')?[['rep','Repasse']]:[]),['hist','Histórico']].map(([k,n])=>`<button class="s" id="t_${k}" onclick="tab('${k}','${id}')">${n}</button>`).join('')}</div><div id="tb"></div></div>`;
 window._int=r;window._pode=me.papel.startsWith('medico')&&c.situacao_internacao==='internado';tab(window._tab&&window._tabInt===id?window._tab:'evol',id);window._tabInt=id}catch(e){$('#v').innerHTML=`<div class="card"><button class="s" onclick="go('painel')">← painel</button>${msg(e.message)}</div>`}}
async function alerg(p,s,id){try{await api('/api/pacientes/alergias',{paciente_id:p,status:s});internacao(id)}catch(e){alert(e.message)}}

const MOT={rotina:'Rotina',intercorrencia:'Intercorrência',admissao:'Admissão',pre_alta:'Pré-alta',outro:'Outro'};
const EVF=[['subjetivo','Relato subjetivo (queixas do paciente)'],['objetivo','Exame objetivo / sinais vitais'],['estado_mental','Estado mental'],['sono','Sono'],['apetite','Apetite / alimentação'],['comportamento','Comportamento'],['adesao','Adesão ao tratamento'],['efeitos_adversos','Efeitos adversos'],['impressao_diagnostica','Impressão diagnóstica'],['conduta','Conduta*'],['texto_livre','Texto livre / observações']];
function aba(k,id){if(!$('#aba'))$('#tb').insertAdjacentHTML('beforeend','<div id="aba"></div>');$('#aba').innerHTML='';({evol:()=>formEvol(id),presc:()=>formPresc(id),exames:()=>telaExames(id)})[k]();$('#aba').scrollIntoView({behavior:'smooth'})}
const lerArq=f=>new Promise((ok,no)=>{if(f.size>8*1024*1024)return no(new Error(f.name+': maior que 8 MB'));const r=new FileReader();r.onload=()=>ok({nome:f.name,mime:f.type,base64:String(r.result).split(',')[1]});r.onerror=()=>no(new Error('falha ao ler '+f.name));r.readAsDataURL(f)});
const dtl=d=>{const x=d?new Date(d):new Date();x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
async function formEvol(id,r){const e=(r&&r.evolucao)||{};const edit=!!r;const ant=await api('/api/evolucoes/recentes?internacao_id='+id);
 $('#aba').innerHTML=`<div class="card"><details ${ant.length?'open':''}><summary><b>Evoluções anteriores desta internação (${ant.length})</b></summary>${ant.map(x=>`<div class="item"><b>${fd(x.ocorrido_em)}</b> · ${esc(x.autor)}<div class="sub">${esc([x.subjetivo&&'S: '+x.subjetivo,x.objetivo&&'O: '+x.objetivo,x.conduta&&'Conduta: '+x.conduta].filter(Boolean).join(' | ').slice(0,500))}</div></div>`).join('')||'<p class="mut">Nenhuma evolução assinada ainda.</p>'}</details></div><div class="card"><h2>${edit?'Editar rascunho de evolução':'Nova evolução'}</h2><div id="em2"></div>
 <div class="g3"><div><label>Tipo</label><select id="ev_motivo">${Object.entries(MOT).map(([k,v])=>`<option value="${k}" ${e.motivo===k?'selected':''}>${v}</option>`).join('')}</select></div>
 ${edit?'':`<div><label>Data/hora da evolução</label><input id="ev_data" type="datetime-local" value="${dtl()}"></div><div><label>Justificativa (se retroativa &gt; 12h)</label><input id="ev_just"></div>`}</div>
 ${EVF.map(([k,l])=>`<label>${l}</label><textarea id="ev_${k}" ${['subjetivo','objetivo','conduta','texto_livre'].includes(k)?'':'style="min-height:46px"'}>${esc(e[k]||'')}</textarea>`).join('')}

 <div><label for="rf_h">Hospital</label><select id="rf_h" onchange="REPF.hosp=this.value;repLista()"><option value="">Todos</option>${hs.map(x=>`<option value="${x.id}" ${REPF.hosp===x.id?'selected':''}>${esc(x.nome_fantasia)}</option>`).join('')}</select></div>
 <div style="align-self:end"><button class="s" onclick="repGerar()">⟳ Gerar visitas das evoluções</button> <button class="s" onclick="repCsv()">⬇ CSV</button></div></div>
 <div class="tabs" id="rtabs" style="margin-top:12px"><button class="s ${REPF.aba==='pac'?'on2':''}" onclick="REPF.aba='pac';repLista()">Por paciente</button><button class="s ${REPF.aba==='cr'?'on2':''}" onclick="REPF.aba='cr';repLista()">Contas a receber</button><button class="s ${REPF.aba==='reg'?'on2':''}" onclick="REPF.aba='reg';repLista()">Regras de valor</button></div></div><div id="rpb"></div>`;repLista()}
const qs=()=>`competencia=${REPF.comp}${REPF.hosp?'&hospital_id='+REPF.hosp:''}`;
function cards(t){return `<div class="g4" style="margin-bottom:12px">${[['Previsto (a faturar)',t.previsto,''],['A receber (faturado)',t.a_receber,''],['Vencido',t.vencido,'bad'],['Recebido',t.recebido,'ok']].map(([n,v,c])=>`<div class="card" style="margin:0"><div class="mut">${n}</div><div class="${c}" style="font-size:20px;font-weight:700">${brl(v)}</div></div>`).join('')}</div>`}
function acoes(i){if(i.situacao==='cancelado')return '';const a=[];
 if(i.status_base==='previsto')a.push(`<button class="s" onclick="repFat('${i.id}')">Faturar</button>`);
 if(Number(i.saldo_centavos)>0)a.push(`<button class="s" onclick="repRec('${i.id}',${i.saldo_centavos})">Receber</button><button class="s" onclick="repGlosa('${i.id}',${i.saldo_centavos})">Glosa</button>`);
 if(!Number(i.recebido_centavos))a.push(`<button class="s" onclick="repCanc('${i.id}')">Cancelar</button>`);
 a.push(`<button class="s" onclick="repHist('${i.id}')">Histórico</button>`);return a.join(' ')}
const linhaRep=i=>`<tr><td>${fdd(String(i.data_servico).slice(0,10))}</td><td>${esc(i.tipo)}${i.origem==='evolucao'?' <span class="mut">(auto)</span>':''}<div class="mut">${esc(i.descricao||'')}</div></td><td>${esc(i.fonte_pagadora||i.hospital)}</td><td class="num">${brl(i.valor_centavos)}</td><td class="num">${brl(i.recebido_centavos)}${Number(i.glosa_centavos)?`<div class="warn">glosa ${brl(i.glosa_centavos)}</div>`:''}</td><td class="num"><b>${brl(i.saldo_centavos)}</b></td><td>${i.vencimento?fdd(String(i.vencimento).slice(0,10)):'—'}${i.dias_atraso>0&&i.situacao!=='recebido'&&i.situacao!=='glosado'?`<div class="bad">${i.dias_atraso} d atraso</div>`:''}</td><td><span class="sit ${i.situacao}">${SITR[i.situacao]}</span></td><td>${acoes(i)}</td></tr>`;
const CAB='<tr><th>Data</th><th>Serviço</th><th>Fonte pagadora</th><th class="num">Valor</th><th class="num">Recebido</th><th class="num">Saldo</th><th>Venc.</th><th>Situação</th><th></th></tr>';
async function repLista(){['pac','cr','reg'].forEach((k,i)=>{const b=document.querySelectorAll('#rtabs button')[i];if(b)b.classList.toggle('on2',REPF.aba===k)});const T=$('#rpb');
 try{if(REPF.aba==='reg')return repRegras();
 if(REPF.aba==='cr'){const r=await api('/api/repasse/receber');const f=r.faixas;
  T.innerHTML=`<div class="g4" style="margin-bottom:12px">${[['A vencer',f.a_vencer,''],['1–30 dias',f.d1_30,'warn'],['31–60 dias',f.d31_60,'warn'],['61–90 dias',f.d61_90,'bad'],['+90 dias',f.d90_mais,'bad']].map(([n,v,c])=>`<div class="card" style="margin:0"><div class="mut">${n}</div><div class="${c}" style="font-size:18px;font-weight:700">${brl(v)}</div></div>`).join('')}</div>
  <div class="card"><h3 style="margin-top:0">Por fonte pagadora</h3>${r.por_fonte.length?`<table>${r.por_fonte.map(x=>`<tr><td>${esc(x.fonte)}</td><td class="num"><b>${brl(x.saldo)}</b></td></tr>`).join('')}</table>`:'<p class="mut">Nada em aberto.</p>'}</div>
  <div class="card"><h3 style="margin-top:0">Títulos em aberto (todas as competências)</h3>${r.itens.length?`<table><tr><th>Paciente</th>${CAB.slice(4)}`+r.itens.map(i=>linhaRep(i).replace('<tr>',`<tr><td><b>${esc(i.paciente)}</b><div class="mut">${esc(i.hospital)}</div></td>`)).join('')+'</table>':'<p class="mut">Nenhum título em aberto.</p>'}</div>`;return}
 const r=await api('/api/repasse?'+qs());const g={};r.itens.forEach(i=>{(g[i.paciente_id]=g[i.paciente_id]||{nome:i.paciente,cod:i.paciente_codigo,hosp:i.hospital,l:[]}).l.push(i)});
 T.innerHTML=cards(r.totais)+(Object.keys(g).length?Object.values(g).map(p=>{const at=p.l.filter(x=>x.situacao!=='cancelado');return `<div class="card"><div class="hh"><b>${esc(p.nome)} <span class="mut">${esc(p.cod)} · ${esc(p.hosp)}</span></b><span>${at.length} lançamento(s) · saldo <b>${brl(at.reduce((a,x)=>a+Number(x.saldo_centavos),0))}</b></span></div><table>${CAB}${p.l.map(linhaRep).join('')}</table></div>`}).join(''):'<div class="card"><p class="mut">Nenhum lançamento nesta competência. Cadastre a regra de valor do hospital e use “Gerar visitas das evoluções”, ou lance manualmente dentro da internação do paciente (aba Repasse).</p></div>')}catch(e){T.innerHTML=`<div class="card">${msg(e.message)}</div>`}}
async function repRegras(){const [rg,hs]=await Promise.all([api('/api/repasse/regras'),api('/api/hospitais')]);
 $('#rpb').innerHTML=`<div class="card"><h3 style="margin-top:0">Valor por serviço, por hospital</h3><p class="mut">Usado para gerar as visitas automaticamente a partir das suas evoluções assinadas (1 visita por paciente/dia).</p>${rg.length?`<table><tr><th>Hospital</th><th>Tipo</th><th class="num">Valor</th><th>Prazo</th><th>Fonte pagadora</th></tr>${rg.map(x=>`<tr><td>${esc(x.hospital)}</td><td>${esc(x.tipo)}</td><td class="num">${brl(x.valor_centavos)}</td><td>${x.prazo_pagamento_dias} dias</td><td>${esc(x.fonte_pagadora||'')}</td></tr>`).join('')}</table>`:'<p class="mut">Nenhuma regra cadastrada.</p>'}</div>
 <div class="card"><h3 style="margin-top:0">Definir regra</h3><div id="rgm"></div><div class="g3"><div><label for="r_h">Hospital</label><select id="r_h">${hs.map(x=>`<option value="${x.id}">${esc(x.nome_fantasia)}</option>`).join('')}</select></div><div><label for="r_t">Tipo</label><select id="r_t"><option>visita</option><option>parecer</option><option>plantao</option><option>procedimento</option><option>outro</option></select></div><div><label for="r_v">Valor (R$)</label><input id="r_v" inputmode="decimal" placeholder="0,00"></div>
 <div><label for="r_p">Prazo de pagamento (dias)</label><input id="r_p" value="30"></div><div><label for="r_f">Fonte pagadora</label><input id="r_f" placeholder="hospital, convênio, cooperativa…"></div><div style="align-self:end"><button class="p" onclick="repSalvaRegra()">Salvar regra</button></div></div></div>`}
async function repSalvaRegra(){try{await api('/api/repasse/regras',{hospital_id:$('#r_h').value,tipo:$('#r_t').value,valor:$('#r_v').value,prazo_pagamento_dias:$('#r_p').value,fonte_pagadora:$('#r_f').value});repRegras()}catch(e){$('#rgm').innerHTML=msg(e.message)}}
async function repGerar(){try{const r=await api('/api/repasse/gerar',{competencia:REPF.comp});alert(`${r.criados} visita(s) criada(s); ${r.ja_existentes} já existiam.`+(r.hospitais_sem_regra.length?`\nSem regra de valor: ${r.hospitais_sem_regra.join(', ')}.`:''));repLista()}catch(e){alert(e.message)}}
async function repCsv(){const r=await fetch('/api/repasse/csv?'+qs());if(!r.ok)return alert('Erro ao exportar');const u=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=u;a.download='repasse-'+REPF.comp+'.csv';a.click()}
function repFat(id){dlg(`<h3 style="margin-top:0">Faturar</h3><div id="dm"></div><label for="d_v">Vencimento</label><input id="d_v" type="date"><p class="mut">Vazio = 30 dias a partir de hoje (ou o vencimento já previsto).</p><button class="p" onclick="repAcao('faturar',{ids:['${id}'],vencimento:$('#d_v').value||null})">Faturar</button> <button class="s" onclick="fechar()">Voltar</button>`)}
function repRec(id,sd){dlg(`<h3 style="margin-top:0">Registrar recebimento</h3><div id="dm"></div><label for="d_v">Valor (R$) — saldo ${brl(sd)}</label><input id="d_v" inputmode="decimal" value="${(sd/100).toFixed(2).replace('.',',')}"><label for="d_d">Data do recebimento</label><input id="d_d" type="date" value="${hoje()}"><label for="d_f">Forma</label><input id="d_f" placeholder="PIX, TED, repasse em folha…"><label for="d_o">Observação</label><input id="d_o"><button class="p" onclick="repAcao('receber',{lancamento_id:'${id}',valor:$('#d_v').value,recebido_em:$('#d_d').value,forma:$('#d_f').value,observacao:$('#d_o').value})">Registrar</button> <button class="s" onclick="fechar()">Voltar</button><p class="mut">Recebimentos não são apagados; mantêm histórico.</p>`)}
function repGlosa(id,sd){dlg(`<h3 style="margin-top:0">Registrar glosa</h3><div id="dm"></div><label for="d_v">Valor glosado (R$) — saldo ${brl(sd)}</label><input id="d_v" inputmode="decimal"><label for="d_m">Motivo*</label><input id="d_m"><button class="p" onclick="repAcao('glosa',{id:'${id}',valor:$('#d_v').value,motivo:$('#d_m').value})">Registrar glosa</button> <button class="s" onclick="fechar()">Voltar</button>`)}
function repCanc(id){dlg(`<h3 style="margin-top:0">Cancelar lançamento</h3><div id="dm"></div><label for="d_m">Motivo*</label><input id="d_m"><button class="p" onclick="repAcao('cancelar',{id:'${id}',motivo:$('#d_m').value})">Cancelar lançamento</button> <button class="s" onclick="fechar()">Voltar</button>`)}
async function repHist(id){try{const h=await api('/api/repasse/historico?id='+id);dlg(`<h3 style="margin-top:0">Histórico do lançamento</h3>${h.map(x=>`<div class="item"><b>${esc(x.acao.replace(/_/g,' '))}</b> · ${fd(x.em)}<div class="mut">${esc(JSON.stringify(x.detalhe))}</div></div>`).join('')||'<p class="mut">Sem eventos.</p>'}<button class="s" onclick="fechar()">Fechar</button>`)}catch(e){alert(e.message)}}
async function repAcao(a,b){try{await api('/api/repasse/'+a,b);fechar();if(window._repInt)repInt(window._repInt);else repLista()}catch(e){$('#dm').innerHTML=msg(e.message)}}
async function repInt(id){window._repInt=id;const r=await api('/api/repasse?internacao_id='+id);const T=$('#rpb');
 T.innerHTML=`${cards(r.totais)}${window._pode?`<div class="card"><h3 style="margin-top:0">Lançar serviço</h3><div id="lm"></div><div class="g4"><div><label for="l_t">Tipo</label><select id="l_t"><option>visita</option><option>parecer</option><option>plantao</option><option>procedimento</option><option>outro</option></select></div><div><label for="l_d">Data do serviço</label><input id="l_d" type="date" value="${hoje()}"></div><div><label for="l_v">Valor (R$)</label><input id="l_v" inputmode="decimal"></div><div><label for="l_vc">Vencimento</label><input id="l_vc" type="date"></div></div><div class="g2"><div><label for="l_f">Fonte pagadora</label><input id="l_f"></div><div><label for="l_o">Descrição</label><input id="l_o"></div></div><button class="p" onclick="repLancar('${id}')">Lançar</button></div>`:''}
 <div class="card"><h3 style="margin-top:0">Lançamentos deste paciente</h3>${r.itens.length?`<table>${CAB}${r.itens.map(linhaRep).join('')}</table>`:'<p class="mut">Nenhum lançamento.</p>'}</div>`}
async function repLancar(id){try{await api('/api/repasse/lancar',{internacao_id:id,tipo:$('#l_t').value,data_servico:$('#l_d').value,valor:$('#l_v').value,vencimento:$('#l_vc').value||null,fonte_pagadora:$('#l_f').value,descricao:$('#l_o').value});repInt(id)}catch(e){$('#lm').innerHTML=msg(e.message)}}

const TIPOH={hospital_psiquiatrico:'Hospital psiquiátrico',hospital_geral:'Hospital geral',clinica:'Clínica',caps:'CAPS',outro:'Outro'};
const HF=[['nome_fantasia','Nome do hospital*'],['razao_social','Razão social'],['cnpj','CNPJ'],['cnes','CNES (7 dígitos)'],['diretor_tecnico_nome','Diretor técnico'],['diretor_tecnico_crm','CRM do diretor técnico'],['diretor_tecnico_crm_uf','UF do CRM'],['telefone','Telefone'],['email','E-mail'],['cep','CEP'],['logradouro','Logradouro'],['numero','Número'],['complemento','Complemento'],['bairro','Bairro'],['cidade','Cidade'],['uf','UF']];
async function refreshMe(){Object.assign(me,await api('/api/me'))}
async function hospitais(){try{const hs=await api('/api/hospitais/detalhe');
 $('#v').innerHTML=`<div class="card"><div class="hh"><h2 style="margin:0">Meus hospitais</h2><button class="p" style="margin:0" onclick="formHosp()">＋ Novo hospital</button></div><p class="mut">Cadastre os hospitais reais onde você atua. Eles aparecem automaticamente no cadastro de pacientes. Os dois hospitais “Demo” são fictícios: desative-os quando não precisar mais.</p>
 ${hs.length?`<table><tr><th>Hospital</th><th>Tipo</th><th>Cidade/UF</th><th>Unid.</th><th>Leitos</th><th>Internados</th><th></th></tr>${hs.map(x=>`<tr style="${x.ativo?'':'opacity:.55'}"><td><b>${esc(x.nome_fantasia)}</b><div class="mut">${x.cnpj?'CNPJ '+esc(x.cnpj):''} ${x.cnes?'· CNES '+esc(x.cnes):''}${x.ativo?'':' · <b>desativado</b>'}</div></td><td>${esc(TIPOH[x.tipo]||x.tipo)}</td><td>${esc(x.cidade||'')}${x.uf?'/'+esc(x.uf):''}</td><td>${x.unidades}</td><td>${x.leitos}</td><td>${x.internados}</td>
 <td><button class="s" onclick="formHosp('${x.id}')">Editar</button> <button class="s" onclick="estrutura('${x.id}','${esc(x.nome_fantasia)}')">Unidades e leitos</button> <button class="s" onclick="hospAtivo('${x.id}',${!x.ativo})">${x.ativo?'Desativar':'Reativar'}</button></td></tr>`).join('')}</table>`:'<p class="mut">Nenhum hospital cadastrado.</p>'}</div><div id="hf"></div>`;window._hl=hs}catch(e){$('#v').innerHTML=`<div class="card">${msg(e.message)}</div>`}}
function formHosp(id){const x=id?window._hl.find(h=>h.id===id):{};
 $('#hf').innerHTML=`<div class="card"><h2>${id?'Editar hospital':'Novo hospital'}</h2><div id="hm"></div><div class="g3">${HF.map(([k,l])=>`<div><label for="h_${k}">${l}</label><input id="h_${k}" value="${esc(x[k]||'')}"></div>`).join('')}
 <div><label for="h_tipo">Tipo</label><select id="h_tipo">${Object.entries(TIPOH).map(([k,v])=>`<option value="${k}" ${x.tipo===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
 <label for="h_cab">Cabeçalho dos documentos (aparece em receitas, relatórios e PDFs)</label><textarea id="h_cab" style="min-height:54px">${esc(x.cabecalho_documento||'')}</textarea>
 <button class="p" onclick="salvarHosp(${id?`'${id}'`:'null'})">${id?'Salvar alterações':'Cadastrar hospital'}</button> <button class="s" onclick="$('#hf').innerHTML=''">Cancelar</button></div>`;$('#hf').scrollIntoView({behavior:'smooth'})}
async function salvarHosp(id){try{const b={tipo:$('#h_tipo').value,cabecalho_documento:$('#h_cab').value};HF.forEach(([k])=>b[k]=$('#h_'+k).value);if(id){b.id=id;await api('/api/hospitais/atualizar',b)}else await api('/api/hospitais',b);await refreshMe();hospitais()}catch(e){$('#hm').innerHTML=msg(e.message)}}
async function hospAtivo(id,a){try{await api('/api/hospitais/ativo',{id,ativo:a});await refreshMe();hospitais()}catch(e){alert(e.message)}}
async function estrutura(id,nome){try{const us=await api('/api/hospitais/estrutura?id='+id);
 $('#hf').innerHTML=`<div class="card"><h2>Unidades e leitos — ${esc(nome)}</h2><div id="em3"></div>
 ${us.map(u=>`<div class="item"><div class="hh"><b>${esc(u.nome)} <span class="mut">${esc(u.tipo||'')}</span></b><span class="mut">${u.leitos.filter(l=>l.ativo).length} leito(s)</span></div><div class="chips">${u.leitos.map(l=>`<span class="tag" style="${l.ativo?'':'opacity:.5'}">${esc(l.identificacao)}${l.ocupado?' ●':''}${l.ativo&&!l.ocupado?` <a href="#" title="desativar" onclick="leitoAtivo('${l.id}',false,'${id}','${esc(nome)}');return false">×</a>`:''}</span>`).join('')||'<span class="mut">sem leitos</span>'}</div>
 <div class="g4" style="margin-top:8px"><div><label for="ln_${u.id}">Identificação / prefixo</label><input id="ln_${u.id}" placeholder="Leito 1  ou  L"></div><div><label for="lq_${u.id}">Quantidade</label><input id="lq_${u.id}" value="1"></div><div><label for="lt_${u.id}">Acomodação</label><input id="lt_${u.id}" placeholder="enfermaria, apartamento…"></div><div style="align-self:end"><button class="s" onclick="addLeitos('${u.id}','${id}','${esc(nome)}')">＋ Adicionar leito(s)</button></div></div></div>`).join('')||'<p class="mut">Nenhuma unidade. Crie a primeira abaixo.</p>'}
 <h3>Nova unidade</h3><div class="g3"><div><label for="un_n">Nome (ex.: Enfermaria A)</label><input id="un_n"></div><div><label for="un_t">Tipo</label><input id="un_t" placeholder="enfermaria, UTI, observação…"></div><div style="align-self:end"><button class="p" onclick="addUnidade('${id}','${esc(nome)}')">Criar unidade</button></div></div>
 <p class="mut">● = leito ocupado. Com quantidade maior que 1, o sistema numera (L01, L02…).</p><button class="s" onclick="$('#hf').innerHTML=''">Fechar</button></div>`;$('#hf').scrollIntoView({behavior:'smooth'})}catch(e){alert(e.message)}}
async function addUnidade(id,n){try{await api('/api/unidades',{hospital_id:id,nome:$('#un_n').value,tipo:$('#un_t').value});estrutura(id,n)}catch(e){$('#em3').innerHTML=msg(e.message)}}
async function addLeitos(u,id,n){try{await api('/api/leitos',{unidade_id:u,identificacao:$('#ln_'+u).value,quantidade:$('#lq_'+u).value,tipo_acomodacao:$('#lt_'+u).value});estrutura(id,n)}catch(e){$('#em3').innerHTML=msg(e.message)}}
async function leitoAtivo(l,a,id,n){try{await api('/api/leitos/ativo',{id:l,ativo:a});estrutura(id,n)}catch(e){$('#em3').innerHTML=msg(e.message)}}
async function assinar(id,b){try{await api('/api/registros/assinar',{id});registro(id,b)}catch(e){registro(id,b,e.message)}}
async function adendo(id,b){try{await api('/api/registros/adendo',{id,justificativa:$('#aj').value,conteudo:$('#ac').value});registro(id,b)}catch(e){$('#ad').innerHTML=msg(e.message)}}
async function auditoria(){try{const r=await api('/api/auditoria');$('#v').innerHTML=`<div class="card"><h2>Trilha de auditoria</h2>${r.quebras.length?msg('Cadeia de hash com '+r.quebras.length+' quebra(s)!'):msg('Cadeia de hash íntegra.',1)}
 <table><tr><th>#</th><th>Quando</th><th>Ação</th><th>Entidade</th><th>Usuário</th></tr>${r.eventos.map(e=>`<tr><td>${e.seq}</td><td>${fd(e.ocorrido_em)}</td><td>${esc(e.acao)}</td><td>${esc(e.entidade||'')}</td><td>${esc(e.usuario||'')}</td></tr>`).join('')}</table></div>`}catch(e){$('#v').innerHTML=`<div class="card"><h2>Auditoria</h2>${msg(e.message)}</div>`}}

// ================= Documentos, receitas, PDF e compartilhamento =================
const DOC_TIPOS=[['atestado','Atestado'],['relatorio','Relatório médico'],['parecer','Parecer'],['declaracao','Declaração'],['encaminhamento','Encaminhamento'],['solicitacao_exames','Solicitação de exames']];
const PDF_TIPOS=['evolucao','prescricao','receita','parecer','relatorio','atestado','declaracao','encaminhamento','solicitacao_exames','resumo_alta'];
function detalheDoc(r){let o='';const d=r.documento;
 if(d){o+=`<h3>${esc(d.titulo||'')}</h3>${d.destinatario?`<p class="mut">Destinatário: ${esc(d.destinatario)}</p>`:''}${d.finalidade?`<p class="mut">Finalidade: ${esc(d.finalidade)}</p>`:''}<div style="white-space:pre-wrap">${esc(d.corpo||'')}</div>${r.tipo==='atestado'?`<p><b>Afastamento:</b> ${d.dias_afastamento} dia(s)${d.cid_codigo?` · CID ${esc(d.cid_codigo)} — ${esc(d.cid_descricao)}`:''}</p>`:''}`}
 if(r.receita){o+=`<p class="mut">Receita ${esc(r.receita.tipo)}${r.receita.validade_ate?' · validade '+fdd(String(r.receita.validade_ate).slice(0,10)):''}</p><table><tr><th>#</th><th>Medicamento</th><th>Posologia</th><th>Qtd.</th></tr>${r.receita_itens.map(i=>`<tr><td>${i.ordem}</td><td><b>${esc(i.principio)}${i.concentracao_valor?' '+Number(i.concentracao_valor)+' '+esc(i.concentracao_unidade||''):''}</b><div class="mut">${esc(i.forma_farmaceutica)}</div></td><td>${esc(i.via)}: ${esc(i.posologia)}</td><td>${Number(i.quantidade)} ${esc(i.unidade_quantidade)}</td></tr>`).join('')}</table>${r.receita.observacoes?`<p>${esc(r.receita.observacoes)}</p>`:''}`}
 return o}
function barraPdf(r,id,back){if(!PDF_TIPOS.includes(r.tipo)||r.status==='anulado')return '';const a=r.status==='assinado';
 return `<h3>PDF, impressão e compartilhamento</h3><div id="pdfm"></div><div class="tabs"><button class="s" onclick="pdfVer('${r.id}')">👁 Visualizar PDF</button><button class="s" onclick="pdfImprimir('${r.id}',${a})">🖨 Imprimir</button><button class="s" onclick="pdfBaixar('${r.id}',${a})">⬇ Baixar PDF</button>${a?`<button class="p" style="margin:0" onclick="dlgCompartilhar('${r.id}')">↗ Compartilhar (WhatsApp / Drive)</button>`:''}</div>
 ${a?'<div id="cpl"></div>':'<p class="mut">Rascunho: o PDF sai com marca "RASCUNHO" e não pode ser compartilhado. Assine para liberar o compartilhamento.</p>'}<div id="pdfv"></div>`}
async function pdfBlob(rid){const r=await fetch('/api/pdf?registro_id='+rid);if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.erro||'Erro '+r.status)}
 const cd=r.headers.get('content-disposition')||'';const m=/filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(cd);return {bl:await r.blob(),nome:m?decodeURIComponent(m[1]):'documento.pdf'}}
function baixarBlob(bl,nome){const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function regCanal(rid,canal,desc,fin){return api('/api/compartilhamentos',{registro_id:rid,canal,destinatario_tipo:'proprio_medico',destinatario_descricao:desc,finalidade:fin})}
async function pdfVer(rid){try{const {bl}=await pdfBlob(rid);const u=URL.createObjectURL(bl);$('#pdfv').innerHTML=`<iframe src="${u}" style="width:100%;height:75vh;border:1px solid var(--br);border-radius:6px"></iframe>`;$('#pdfv').scrollIntoView({behavior:'smooth'})}catch(e){$('#pdfm').innerHTML=msg(e.message)}}
async function pdfBaixar(rid,ass){try{const {bl,nome}=await pdfBlob(rid);if(ass)await regCanal(rid,'download','Próprio médico (arquivo baixado)','Download do PDF');baixarBlob(bl,nome);$('#pdfm').innerHTML=msg('PDF baixado.',1)}catch(e){$('#pdfm').innerHTML=msg(e.message)}}
async function pdfImprimir(rid,ass){try{const {bl}=await pdfBlob(rid);if(ass)await regCanal(rid,'impressao','Impressão local','Impressão do documento');const u=URL.createObjectURL(bl);
 const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';f.src=u;f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(_){window.open(u,'_blank')}};document.body.appendChild(f);setTimeout(()=>f.remove(),120000);$('#pdfm').innerHTML=msg('Abrindo a janela de impressão… se não abrir, use "Visualizar PDF" e imprima pelo leitor.',1)}catch(e){$('#pdfm').innerHTML=msg(e.message)}}
function dlgCompartilhar(rid){const seg=window.isSecureContext&&!!navigator.share;
 dlg(`<h2>Compartilhar documento</h2><div id="cm_m"></div><p class="mut">O envio fica registrado (quem, para quem, finalidade). Confira o destinatário: dados de saúde são sensíveis (LGPD).</p>
 <label for="cp_t">Destinatário*</label><select id="cp_t"><option value="paciente">Paciente</option><option value="responsavel_legal">Responsável legal</option><option value="familiar">Familiar</option><option value="outro_profissional">Outro profissional</option><option value="instituicao">Instituição</option><option value="proprio_medico">Eu mesmo (backup/Drive)</option><option value="outro">Outro</option></select>
 <label for="cp_d">Nome / relação*</label><input id="cp_d" placeholder="ex.: mãe do paciente"><label for="cp_f">Finalidade* (mín. 5 caracteres)</label><input id="cp_f" placeholder="ex.: entrega de atestado">
 <label for="cp_n">Celular do destinatário (WhatsApp, opcional, com DDD)</label><input id="cp_n" inputmode="tel" placeholder="21999999999">
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cp_c" style="width:auto"> Conferi o destinatário e o número/endereço</label>
 <div class="tabs" style="margin-top:12px"><button class="p" style="margin:0" onclick="doCompart('${rid}','whatsapp')">WhatsApp</button><button class="p" style="margin:0" onclick="doCompart('${rid}','drive')">Google Drive</button><button class="s" onclick="doCompart('${rid}','menu')">Menu do aparelho</button><button class="s" onclick="fechar()">Cancelar</button></div>
 <p class="mut">${seg?'Seu aparelho permite enviar o PDF direto pelo menu de compartilhamento (WhatsApp, Drive e outros apps).':'Este endereço não usa HTTPS, então o navegador não permite enviar o arquivo direto para o app: o PDF será baixado e o WhatsApp/Drive será aberto para você anexá-lo.'}</p>`)}
async function doCompart(rid,via){try{const canal=via==='whatsapp'?'whatsapp':via==='drive'?'outro':'outro';const tipo=$('#cp_t').value,desc=$('#cp_d').value.trim()||'',fin=$('#cp_f').value.trim();
 const j=await api('/api/compartilhamentos',{registro_id:rid,canal,destinatario_tipo:via==='drive'?'proprio_medico':tipo,destinatario_descricao:via==='drive'&&!desc?'Google Drive do médico':desc,finalidade:via==='drive'&&!fin?'Cópia no Google Drive':fin,conferiu_destinatario:$('#cp_c').checked});
 const r=await fetch('/api/arquivo?id='+j.arquivo_id);if(!r.ok)throw new Error('Não foi possível obter o PDF.');const bl=await r.blob();const file=new File([bl],j.nome,{type:'application/pdf'});
 const txt=`Documento médico em PDF (código de validação ${j.codigo}).`;const nat=window.isSecureContext&&navigator.canShare&&navigator.canShare({files:[file]});
 if(nat){try{await navigator.share({files:[file],title:j.nome,text:txt});fechar();$('#cpl').innerHTML=msg('Compartilhado.',1);cargaCompart(rid);return}catch(e){if(e.name==='AbortError'){$('#cm_m').innerHTML=msg('Envio cancelado (o registro de compartilhamento foi salvo).');return}}}
 baixarBlob(bl,j.nome);
 if(via==='whatsapp'){const n=($('#cp_n').value||'').replace(/\D/g,'');window.open('https://wa.me/'+(n?(n.length<=11?'55'+n:n):'')+'?text='+encodeURIComponent(txt+' O PDF foi baixado no seu aparelho: anexe-o na conversa.'),'_blank','noopener')}
 else if(via==='drive'){window.open('https://drive.google.com/drive/my-drive','_blank','noopener')}
 fechar();$('#cpl').innerHTML=msg(via==='whatsapp'?'PDF baixado e WhatsApp aberto: anexe o arquivo baixado na conversa.':via==='drive'?'PDF baixado e Google Drive aberto: arraste o arquivo baixado para o Drive (ou use “Novo → Upload de arquivo”).':'PDF baixado.',1);cargaCompart(rid)}catch(e){$('#cm_m').innerHTML=msg(e.message)}}
async function cargaCompart(rid){try{const l=await api('/api/compartilhamentos?registro_id='+rid);if($('#cpl')&&l.length)$('#cpl').insertAdjacentHTML('beforeend',`<table><tr><th>Quando</th><th>Canal</th><th>Destinatário</th><th>Finalidade</th><th>Código</th></tr>${l.map(x=>`<tr><td>${fd(x.compartilhado_em)}</td><td>${esc(x.canal)}</td><td>${esc(x.destinatario_descricao)}</td><td>${esc(x.finalidade)}</td><td>${esc(x.codigo_validacao)}</td></tr>`).join('')}</table>`)}catch(_){}}
async function telaDocs(id){const T=$('#tb');const l=await api('/api/documentos?internacao_id='+id);
 T.innerHTML=`${window._pode?`<div class="tabs"><button class="p" style="margin:0" onclick="formDoc('${id}')">＋ Novo documento (atestado, relatório, parecer…)</button><button class="p" style="margin:0" onclick="formReceita('${id}')">＋ Nova receita</button></div>`:''}<div id="aba"></div>
 <h3>Documentos e receitas desta internação</h3>${l.length?`<table><tr><th>Data</th><th>Tipo</th><th>Autor</th><th>Status</th><th>PDF</th></tr>`+l.map(g=>`<tr class="lk" onclick="registro('${g.id}','${id}')"><td>${fd(g.ocorrido_em)}</td><td>${esc(TIPO_ROT[g.tipo]||g.tipo)}${g.titulo?`<div class="mut">${esc(g.titulo)}</div>`:''}</td><td>${esc(g.autor)}</td><td>${esc(g.status)}</td><td>${g.pdfs?g.pdfs+' gerado(s)':'—'}</td></tr>`).join('')+'</table>':'<p class="mut">Nenhum documento.</p>'}
 <h3>PDF das evoluções por período</h3><div class="g3"><div><label>De</label><input id="pe_i" type="date"></div><div><label>Até</label><input id="pe_f" type="date"></div><div style="align-self:end"><button class="s" onclick="pdfPeriodo('${id}')">Gerar PDF das evoluções assinadas</button></div></div><div id="pe_m"></div>`}
async function pdfPeriodo(id){try{const q=new URLSearchParams({internacao_id:id});if($('#pe_i').value)q.set('inicio',$('#pe_i').value);if($('#pe_f').value)q.set('fim',$('#pe_f').value);
 const r=await fetch('/api/pdf/evolucoes?'+q);if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.erro||'Erro '+r.status)}baixarBlob(await r.blob(),'evolucoes.pdf');$('#pe_m').innerHTML=msg('PDF gerado e baixado.',1)}catch(e){$('#pe_m').innerHTML=msg(e.message)}}
async function formDoc(id,r){const d=(r&&r.documento)||{};const ed=!!r;const cids=await api('/api/cid?q=');window._docEd=ed?r.id:null;
 $('#aba').innerHTML=`<div class="card"><h2>${ed?'Editar rascunho':'Novo documento'}</h2><div id="dc_m"></div>
 <div class="g2"><div><label>Tipo</label><select id="dc_t" ${ed?'disabled':''} onchange="$('#dc_x').style.display=this.value==='atestado'?'':'none'">${DOC_TIPOS.map(([k,n])=>`<option value="${k}" ${ed&&r.tipo===k?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Título</label><input id="dc_ti" value="${esc(d.titulo||'')}" placeholder="vazio = título padrão"></div>
 <div><label>Destinatário</label><input id="dc_d" value="${esc(d.destinatario||'')}" placeholder="a quem se destina"></div><div><label>Finalidade</label><input id="dc_f" value="${esc(d.finalidade||'')}"></div></div>
 <div id="dc_x" style="display:${(ed?r.tipo:'atestado')==='atestado'?'':'none'}"><div class="g2"><div><label>Dias de afastamento* (0 se não houver)</label><input id="dc_a" type="number" min="0" max="365" value="${d.dias_afastamento??''}"></div>
 <div><label>CID (opcional — só com ciência/consentimento do paciente)</label><select id="dc_c"><option value="">Não informar CID</option>${cids.map(c=>`<option value="${c.id}" ${d.cid_id===c.id?'selected':''}>${esc(c.codigo)} — ${esc(c.descricao)}</option>`).join('')}</select></div></div></div>
 <label>Texto do documento*</label><textarea id="dc_b" style="min-height:160px">${esc(d.corpo||'')}</textarea>
 <button class="p" onclick="salvarDoc('${id}',true)">Assinar e salvar</button> <button class="s" onclick="salvarDoc('${id}',false)">Salvar rascunho</button></div>`}
async function salvarDoc(id,as){try{const ed=window._docEd;const b={tipo:ed?undefined:$('#dc_t').value,titulo:$('#dc_ti').value,destinatario:$('#dc_d').value,finalidade:$('#dc_f').value,corpo:$('#dc_b').value,dias_afastamento:$('#dc_a')?$('#dc_a').value:'',cid_id:$('#dc_c')&&$('#dc_c').value||null,assinar:as};
 const j=ed?await api('/api/documentos/atualizar',{...b,id:ed}):await api('/api/documentos',{...b,internacao_id:id});
 registro(j.id,id,j.erro_assinatura?('Salvo como rascunho. Pendências para assinar: '+j.erro_assinatura):(as?'Documento assinado. Já pode gerar o PDF.':'Rascunho salvo.'))}catch(e){$('#dc_m').innerHTML=msg(e.message)}}
async function formReceita(id){await carregaCat();window._ri=id;window._rit=0;
 $('#aba').innerHTML=`<div class="card"><h2>Nova receita (simples)</h2><div id="rc_m"></div><p class="mut">Medicamentos de controle especial/antimicrobianos seguem o fluxo oficial externo (receituário/sistema oficial com assinatura ICP-Brasil): o MEDNEXO não gera numeração própria.</p>
 ${CAT.length?'':'<p class="mut">O catálogo de medicamentos está vazio — o médico administrador cadastra em Prescrições → “Cadastrar medicamento no catálogo”.</p>'}
 <div class="g2"><div><label>Validade</label><input id="rc_v" type="date"></div><div><label>Observações</label><input id="rc_o"></div></div><h3>Medicamentos</h3><div id="rc_i"></div>
 <div class="tabs"><button class="s" onclick="addItemRec()">＋ Adicionar medicamento</button></div>
 <button class="p" onclick="salvarRec(true)">Assinar e salvar</button> <button class="s" onclick="salvarRec(false)">Salvar rascunho</button></div>`;if(CAT.length)addItemRec()}
function addItemRec(){const i=window._rit++;const d=document.createElement('div');d.className='item rci';d.innerHTML=`<div class="hh"><b>Item</b><button class="s" onclick="this.closest('.item').remove()">remover</button></div><label>Medicamento*</label><select class="r_ap">${CAT.map(m=>`<option value="${m.id}">${esc(rotCat(m))}</option>`).join('')}</select>
 <div class="g4"><div><label>Via*</label><select class="r_via">${VIAS.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Quantidade*</label><input class="r_q"></div><div><label>Unidade*</label><input class="r_u" placeholder="comprimidos, frascos…"></div><div></div></div>
 <label>Posologia*</label><input class="r_p" placeholder="1 comprimido pela manhã, por 30 dias"><label>Observações</label><input class="r_ob">`;$('#rc_i').appendChild(d)}
async function salvarRec(as){try{const itens=[...document.querySelectorAll('.rci')].map(e=>({apresentacao_id:e.querySelector('.r_ap').value,via:e.querySelector('.r_via').value,quantidade:e.querySelector('.r_q').value,unidade_quantidade:e.querySelector('.r_u').value,posologia:e.querySelector('.r_p').value,observacoes:e.querySelector('.r_ob').value}));
 const j=await api('/api/receitas',{internacao_id:window._ri,validade_ate:$('#rc_v').value||null,observacoes:$('#rc_o').value,itens,assinar:as});registro(j.id,window._ri,j.erro_assinatura?('Salvo como rascunho. Pendências para assinar: '+j.erro_assinatura):(as?'Receita assinada. Já pode gerar o PDF.':'Rascunho salvo.'))}catch(e){$('#rc_m').innerHTML=msg(e.message)}}
fetch('/api/me').then(r=>r.ok?r.json():null).then(j=>{me=j;render()});
</script></body></html>
